<script>

/* =========================================================

========================================================= */

const names=[
"Spark","Pebble","Leaf","Breeze","Drop","Dew","Dust","Glow","Ember","Frost",
"Flame","Mist","Stone","Bloom","Cloud","Wave","Shadow","Thunder","Crystal","Venom",
"Solar","Lunar","Comet","Void","Inferno","Glacier","Tempest","Abyss","Eclipse","Phantom",

"Cosmic","Astral","Heavenly","Doom","Worldbreaker","Reality","Ancient","Forbidden","Immortal","Transcendent",
"Absolute","Unbound","Limitless","Paradox","Omniversal","Finality","Godly","The Chosen","The First","Beyond",
"Limitless X","Eternal Flame","Origin","The End","Null","Impossible","Infinite Void","Creator","Absolute Zero","1/0"

const odds=[
5,12,20,35,50,70,90,120,160,210,
275,350,450,575,725,900,1100,1350,1650,2000,
2400,2900,3500,4200,5000,6000,7200,8600,10000,12000,
14500,17500,21000,25000,30000,36000,43000,51000,60000,70000,
82000,95000,110000,130000,150000,175000,200000,230000,260000,300000,
350000,400000,460000,525000,600000,700000,800000,950000,1100000,1300000,
1500000,1800000,2100000,2500000,3000000,3500000,4200000,5000000,6000000,7500000,
9000000,11000000,14000000,18000000,25000000,50000000,100000000,1000000000,10000000000,0
];

const auras=names.map((name,i)=>({
 name,
 odds:odds[i],
 owned:0,
 total:0
}));

/* =========================================================
   BIOMES
========================================================= */

const biomes=[
{name:"Plains",rare:1,time:120,luck:1,bg:"#fff"},
{name:"Forest",rare:2,time:100,luck:1.05,bg:"#dff5df"},
{name:"Desert",rare:4,time:90,luck:1.1,bg:"#f8e8b0"},

{name:"Water",rare:8,time:75,luck:1.3,bg:"#b8e8ff"},

{name:"Tsunami",rare:20,time:60,luck:1.7,bg:"#65a9d1"},
{name:"Storm",rare:30,time:55,luck:1.9,bg:"#888da5"},
{name:"Volcano",rare:45,time:50,luck:2.1,bg:"#e39b80"},
{name:"Aurora",rare:60,time:45,luck:2.5,bg:"#c0c7ee"},
{name:"Void",rare:100,time:40,luck:3,bg:"#393050"},
{name:"Galaxy",rare:200,time:35,luck:4,bg:"#292052"},

{name:"Reality",rare:800,time:25,luck:7,bg:"#d5d5d5"},
{name:"The End",rare:1500,time:20,luck:10,bg:"#222"}
];

let currentBiome=biomes[0];
let biomeTime=currentBiome.time;
let biomeVisits={};

/* =========================================================
   RECIPES
========================================================= */

const potions=[
{name:"Lucky Brew",luck:5,recipe:{0:2,1:2,2:1}},
{name:"Fortune Tonic",luck:15,recipe:{3:3,5:2,7:1}},
{name:"Golden Elixir",luck:35,recipe:{8:3,10:2,12:2}},
{name:"Mystic Potion",luck:75,recipe:{15:4,17:2,20:1}},
{name:"Void Serum",luck:150,recipe:{22:3,25:3,28:2}},
{name:"Celestial Potion",luck:300,recipe:{32:4,35:3,38:2}},
{name:"Infinity Elixir",luck:600,recipe:{42:5,45:3,48:2}},

{name:"Reality Potion",luck:3000,recipe:{62:5,65:4,68:3}},
{name:"10K LUCK ELIXIR",luck:10000,recipe:{72:10,73:8,74:6,75:5,76:4,77:3,78:2,79:1}}
];

const gloves=[
{name:"Cloth Glove",luck:2,recipe:{0:3,2:2,4:1}},
{name:"Iron Glove",luck:5,recipe:{5:3,7:2,9:1}},
{name:"Golden Glove",luck:10,recipe:{10:4,12:3,15:1}},

{name:"Void Glove",luck:80,recipe:{32:5,34:4,36:2}},
{name:"Galaxy Glove",luck:160,recipe:{40:5,42:4,44:3}},
{name:"Divine Glove",luck:350,recipe:{50:6,52:4,54:3}},
{name:"Reality Glove",luck:800,recipe:{60:6,62:5,64:3}},
{name:"Infinite Glove",luck:2000,recipe:{68:8,70:5,73:3}}
];

const randomizers=[
{name:"Basic Biome Randomizer",luck:1.2,recipe:{8:2,9:2,10:1}},
{name:"Rare Biome Randomizer",luck:1.5,recipe:{15:3,17:2,19:1}},
{name:"Epic Biome Randomizer",luck:2,recipe:{25:4,28:3,30:2}},
{name:"Legendary Biome Randomizer",luck:3,recipe:{38:4,40:3,43:2}},
{name:"Mythic Biome Randomizer",luck:5,recipe:{50:5,53:4,55:2}},
{name:"Divine Biome Randomizer",luck:8,recipe:{60:6,63:4,66:3}},
{name:"Reality Randomizer",luck:15,recipe:{69:8,71:5,73:3}}
];

let inventory={
 potions:Array(10).fill(0),
 gloves:Array(10).fill(0),
 randomizers:Array(7).fill(0)
};

let autoCraft={
 potion:null,
 glove:null,
 randomizer:null
};

let rolls=0;
let equippedAura=null;
let equippedGlove=null;
let potionLuck=0;
let auto=false;
let busy=false;
let rarest=-1;
let milestones={};

/* =========================================================
   SAVE
========================================================= */

function save(){

 localStorage.setItem("auraRollSave",JSON.stringify({
  auras,
  inventory,
  autoCraft,
  rolls,
  equippedAura,
  equippedGlove,
  potionLuck,
  biomeVisits,
  currentBiome:currentBiome.name,
  biomeTime,
  rarest,
  milestones
 }));

}

/* =========================================================
   LOAD
========================================================= */

function load(){

 let s=localStorage.getItem("auraRollSave");

 if(!s)return;

 try{

  let d=JSON.parse(s);

  if(d.auras)
   d.auras.forEach((a,i)=>{
    if(auras[i])Object.assign(auras[i],a);
   });

  if(d.inventory)inventory=d.inventory;
  if(d.autoCraft)autoCraft=d.autoCraft;

  rolls=d.rolls||0;
  equippedAura=d.equippedAura;
  equippedGlove=d.equippedGlove;
  potionLuck=d.potionLuck||0;
  biomeVisits=d.biomeVisits||{};
  biomeTime=d.biomeTime||120;
  rarest=d.rarest??-1;
  milestones=d.milestones||{};

  let b=biomes.find(x=>x.name===d.currentBiome);

  if(b)currentBiome=b;

 }catch(e){
  console.log(e);
 }

}

/* =========================================================
   ADMIN
========================================================= */

document.getElementById("adminInput").addEventListener("keydown",function(e){

 if(e.key!=="Enter")return;

 if(this.value.toLowerCase().trim()==="rocky"){

  /*
   Give every aura.
   Give every craftable item.
   Set a huge amount so crafting can be tested.
  */

  auras.forEach(a=>{
   a.owned=999999;
   a.total=Math.max(a.total,999999);
  });

  inventory.potions=potions.map(()=>9999);
  inventory.gloves=gloves.map(()=>9999);
  inventory.randomizers=randomizers.map(()=>9999);

  rolls=999999;
  rarest=79;

  biomes.forEach(b=>{
   biomeVisits[b.name]=999;
  });

  equippedAura=79;
  equippedGlove=9;

  applyAuraVFX(79);

  toast("ADMIN: EVERYTHING UNLOCKED");

  update();
  save();

 }else{

  toast("Invalid admin code");

 }

 this.value="";

});

/* =========================================================
   LUCK
========================================================= */

function totalLuck(){

 let glove=
  equippedGlove===null
  ?0
  :gloves[equippedGlove].luck;

 let aura=
  equippedAura===null
  ?0
  :(equippedAura+1)*.02;

 return (1+glove+aura+potionLuck)*currentBiome.luck;

}

/* =========================================================
   ROLL
========================================================= */

function chooseAura(){

 let weights=auras.map((a,i)=>{

  if(i===79)
   return 0.000000000000000000000000001;

  return (1/a.odds)*Math.pow(totalLuck(),.55);

 });

 let total=weights.reduce((a,b)=>a+b,0);

 let r=Math.random()*total;

 for(let i=0;i<weights.length;i++){

  r-=weights[i];

  if(r<=0)return i;

 }

 return 0;

}

function normalRoll(){

 if(busy)return;

 busy=true;

 setTimeout(()=>{

  doRoll();

  busy=false;

 },1000);

}

function fastRoll(){

 if(rolls<150){

  toast("Fast Roll unlocks at 150 rolls");

  return;

 }

 if(busy)return;

 busy=true;

 setTimeout(()=>{

  doRoll();

  busy=false;

 },200);

}

function doRoll(){

 rolls++;

 let id=chooseAura();

 auras[id].owned++;
 auras[id].total++;

 if(id>rarest)
  rarest=id;

 potionLuck=0;

 let rarity=

 showResult(

 );

 if(id>=60){

/* =========================================================
   AUTO ROLL
========================================================= */

function toggleAuto(){

 if(rolls<50){

  toast("Auto Roll unlocks at 50 rolls");

  return;

 }

 auto=!auto;

 update();

 if(auto)
  autoLoop();

}

function autoLoop(){

 if(!auto)return;

 let delay=rolls>=150?200:1000;

 setTimeout(()=>{

  if(!auto)return;

  doRoll();

  autoLoop();

 },delay);

}

/* =========================================================
   RECIPE HELPERS
========================================================= */

function recipeArray(recipe){

 return Object.entries(recipe).map(([id,amount])=>({
  id:Number(id),
  amount:Number(amount)
 }));

}

function canCraft(recipe){

 return recipeArray(recipe).every(x=>
  auras[x.id].owned>=x.amount
 );

}

function consumeRecipe(recipe){

 recipeArray(recipe).forEach(x=>{
  auras[x.id].owned-=x.amount;
 });

}

function recipeHTML(recipe){

 return recipeArray(recipe).map(x=>{

  let a=auras[x.id];

  let rarity=
   a.odds===0
   ?"1/0"
   :"1/"+a.odds.toLocaleString();

  let good=a.owned>=x.amount;

  return `
   <div class="need ${good?"good":"bad"}">
    ${a.owned}/${x.amount} ${a.name}
    <span class="small">(${rarity})</span>
   </div>
  `;

 }).join("");

}

   CRAFT

function craftPotion(i){

 let p=potions[i];

 if(!canCraft(p.recipe)){

  toast("Not enough auras");

 }

 consumeRecipe(p.recipe);

 inventory.potions[i]++;

 toast("Crafted "+p.name);

 update();
 save();

}

function craftGlove(i){

 let g=gloves[i];

 if(!canCraft(g.recipe)){

  toast("Not enough auras");

  return;

 }

 consumeRecipe(g.recipe);

 inventory.gloves[i]++;

 toast("Crafted "+g.name);

 update();

}

function craftRandomizer(i){

 let r=randomizers[i];

 if(!canCraft(r.recipe)){

 }

 consumeRecipe(r.recipe);

 inventory.randomizers[i]++;

/* =========================================================
   AUTO CRAFT
========================================================= */

function setAutoCraft(type,i){

 if(autoCraft[type]===i){

  autoCraft[type]=null;

  toast("Auto craft disabled");

 }else{

  autoCraft[type]=i;

  toast("Auto crafting "+getName(type,i));

 }

 update();
 save();

}

function getName(type,i){

 if(type==="potion")return potions[i].name;
 if(type==="glove")return gloves[i].name;

 return randomizers[i].name;

}

function autoCraftCheck(){

 const types=[
  ["potion",potions,inventory.potions],
  ["glove",gloves,inventory.gloves],
  ["randomizer",randomizers,inventory.randomizers]
 ];

 types.forEach(([type,list,inv])=>{

  let selected=autoCraft[type];

  if(selected===null)return;

  let item=list[selected];

  while(canCraft(item.recipe)){

   consumeRecipe(item.recipe);

   inv[selected]++;

  }

 });

}

/* =========================================================
   USE / EQUIP
========================================================= */

function usePotion(i){

 if(inventory.potions[i]<=0){

  toast("You don't own this potion");

  return;

 }

 inventory.potions[i]--;

 potionLuck=potions[i].luck/100;

 toast(
  potions[i].name+
  " activated: +"+
  potions[i].luck.toLocaleString()+
  "% luck"
 );

 update();
 save();

}

function equipGlove(i){

 if(inventory.gloves[i]<=0){

  toast("You don't own this glove");

  return;

 }

 equippedGlove=i;

 toast("Equipped "+gloves[i].name);

 update();
 save();

}

function equipAura(i){

 if(auras[i].owned<=0){

  toast("You don't currently own this aura");

  return;

 }

 equippedAura=i;

 applyAuraVFX(i);

 toast("Equipped "+auras[i].name);

 update();
 save();

}

/* =========================================================
   BIOMES
========================================================= */

function naturalBiome(){

 let weights=biomes.map((b,i)=>{

  if(i===0)return 30;

  return 1/(b.rare/100+1);

 });

 let total=weights.reduce((a,b)=>a+b,0);

 let r=Math.random()*total;

 for(let i=0;i<weights.length;i++){

  r-=weights[i];

  if(r<=0)return biomes[i];

 }

 return biomes[0];

}

function spawnBiome(b){

 currentBiome=b;

 biomeTime=b.time;

 biomeVisits[b.name]=(biomeVisits[b.name]||0)+1;

 document.body.style.background=b.bg;

 toast("🌎 "+b.name+" biome!");

 update();
 save();

}

function useRandomizer(i){

 if(inventory.randomizers[i]<=0){

  toast("You don't own this randomizer");

  return;

 }

 inventory.randomizers[i]--;

 let possible=biomes.slice(1);

 let b=possible[Math.floor(Math.random()*possible.length)];

 spawnBiome(b);

 update();
 save();

}

========================================================= */

function checkMilestones(){

 if(rolls>=10000&&!milestones[10000]){

  milestones[10000]=true;

  inventory.potions[0]++;

  toast("🏆 10,000 ROLLS — FREE POTION!");

 }

 let amount=Math.floor(rolls/50000);

 for(let i=1;i<=amount;i++){

  let mark=i*50000;

  if(!milestones[mark]){

   milestones[mark]=true;

   inventory.potions[0]++;

   toast(
    "🏆 "+
    mark.toLocaleString()+
    " ROLLS — FREE POTION!"
   );

  }

 }

}

/* =========================================================
   VFX ENGINE
========================================================= */

function applyAuraVFX(id){

 let root=document.getElementById("vfx");

 let rings=document.querySelectorAll(".vfxRing");
 let particles=document.querySelectorAll(".particle");
 let beams=document.querySelectorAll(".beam");
 let symbol=document.getElementById("symbol");
 let floor=document.getElementById("floor");

 let hue=(id*47)%360;

 let color=`hsl(${hue},95%,60%)`;

 root.style.color=color;

 rings.forEach((r,i)=>{

  r.style.color=color;

  /*
   More rare = more rings.
  */

  if(i<=Math.floor(id/20))
   r.style.opacity=.65;
  else
   r.style.opacity=0;

 });

 particles.forEach((p,i)=>{

  p.style.color=color;

  /*
   Rare auras get brighter particles.
  */

  p.style.opacity=id>=20?1:.65;

  p.style.transform=
   `scale(${1+Math.min(id/50,2)})`;

 });

 beams.forEach((b,i)=>{

  b.style.color=color;

  if(id>=10)
   b.style.opacity=.18;
  else
   b.style.opacity=0;

  if(id>=35)
   b.style.opacity=.35;

  if(id>=60)
   b.style.opacity=.6;

 });

 /* Symbols become more dramatic with rarity */

 const symbols=[
  "✦","◆","✧","◈","✹","☄","⚡","☯",
  "∞","✵","✺","✸","◇","⬡","☀","☾",
  "✧","𖤐","♢","◉"
 ];

 symbol.textContent=symbols[Math.floor(id/4)%symbols.length];

 symbol.style.color=color;

 symbol.style.opacity=id>=8?.75:0;

 symbol.style.fontSize=
  (35+Math.min(id*1.3,70))+"px";

 floor.style.color=color;
 floor.style.opacity=id>=15?.35:0;

 /*
  Higher tiers get increasingly large VFX.
 */

 root.style.transform=
  `scale(${1+Math.min(id*.012,.9)})`;

}
