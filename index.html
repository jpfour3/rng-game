     ========================= -->

<style>
#stick {
  width: 110px;
  height: 210px;
  position: relative;
  z-index: 8;
  transition: transform .25s ease, filter .25s ease;
}

/* EQUIPPED INFO ABOVE PLAYER */
#equippedInfo {
  position: absolute;
  left: 50%;
  top: calc(50% - 175px);
  transform: translateX(-50%);
  text-align: center;
  z-index: 15;
  pointer-events: none;
  min-width: 180px;
}

#equippedName {
  font-size: 22px;
  font-weight: 900;
  text-shadow: 0 0 12px currentColor;
}

#equippedRarity {
  font-size: 13px;
  font-weight: bold;
  opacity: .85;
  margin-top: 3px;
}

/* Stronger base aura */
.aura-active {
  animation: auraBreath 1.15s infinite alternate ease-in-out;
}

@keyframes auraBreath {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.045);
  }
}

/* VFX container */
#vfx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

/* =========================
   UNIQUE AURA VFX
   ========================= */

.vfx-orb {
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--c);
  box-shadow:
    0 0 8px var(--c),
    0 0 22px var(--c),
    0 0 45px var(--c);
  animation:orbFloat 2s ease-in-out infinite alternate;
}

@keyframes orbFloat {
  from { transform:translateY(25px) scale(.7); opacity:.35; }
  to { transform:translateY(-25px) scale(1.4); opacity:1; }
}

.vfx-ring {
  position:absolute;
  left:50%;
  top:50%;
  width:220px;
  height:220px;
  margin:-110px;
  border:4px solid var(--c);
  border-radius:50%;
  box-shadow:0 0 20px var(--c), inset 0 0 20px var(--c);
  animation:ringSpin 4s linear infinite;
}

.vfx-ring2 {
  width:150px;
  height:150px;
  margin:-75px;
  border-style:dashed;
  animation:ringSpin 2.5s linear infinite reverse;
}

@keyframes ringSpin {
  to { transform:rotate(360deg); }
}

.vfx-particle {
  position:absolute;
  width:5px;
  height:5px;
  background:var(--c);
  box-shadow:0 0 10px var(--c);
  animation:particleRise 2s linear infinite;
}

@keyframes particleRise {
  from {
    transform:translateY(100px) scale(.2);
    opacity:0;
  }
  30% { opacity:1; }
  to {
    transform:translateY(-160px) scale(1.3);
    opacity:0;
  }
}

.vfx-beam {
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:360px;
  transform:translate(-50%,-50%);
  background:linear-gradient(transparent,var(--c),transparent);
  filter:blur(2px);
  box-shadow:0 0 25px var(--c);
  animation:beamPulse .25s infinite alternate;
}

@keyframes beamPulse {
  from { opacity:.3; }
  to { opacity:1; }
}

/* FLAME */
.vfx-flame {
  position:absolute;
  left:50%;
  top:50%;
  width:170px;
  height:170px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,
    #fff 0%,
    var(--c) 25%,
    transparent 70%);
  filter:blur(8px);
  animation:flamePulse .45s infinite alternate;
}

@keyframes flamePulse {
  from { transform:translate(-50%,-50%) scale(.8); }
  to { transform:translate(-50%,-50%) scale(1.18); }
}

/* LIGHTNING */
.vfx-lightning {
  position:absolute;
  width:3px;
  height:90px;
  background:#fff;
  box-shadow:0 0 10px var(--c),0 0 25px var(--c);
  transform:rotate(var(--r));
  animation:lightningFlash .12s infinite;
}

@keyframes lightningFlash {
  0%,100% { opacity:.1; }
  50% { opacity:1; }
}

/* VOID */
.vfx-void {
  position:absolute;
  left:50%;
  top:50%;
  width:300px;
  height:300px;
  margin:-150px;
  border-radius:50%;
  background:radial-gradient(circle,#000 0%,#050505 35%,transparent 70%);
  box-shadow:0 0 80px #000, inset 0 0 60px #000;
  animation:voidPulse 2s infinite alternate;
}

@keyframes voidPulse {
  from { transform:scale(.8); }
  to { transform:scale(1.15); }
}

/* GLITCH 1/1B */
.glitch-aura {
  position:absolute;
  left:50%;
  top:50%;
  width:280px;
  height:280px;
  margin:-140px;
  border:2px solid #00ffff;
  box-shadow:
    12px 0 #ff0055,
    -12px 0 #00ffff,
    0 0 30px #fff;
  animation:glitchAura .08s infinite steps(2);
}

.glitch-aura::before,
.glitch-aura::after {
  content:"";
  position:absolute;
  inset:20px;
  border:2px dashed #fff;
}

.glitch-aura::after {
  inset:55px;
  border-color:#ff0055;
}

@keyframes glitchAura {
  0% {
    transform:translate(0,0) skew(0);
    filter:hue-rotate(0deg);
  }
  25% {
    transform:translate(8px,-4px) skew(8deg);
    filter:hue-rotate(90deg);
  }
  50% {
    transform:translate(-7px,5px) skew(-10deg);
    filter:hue-rotate(180deg);
  }
  75% {
    transform:translate(5px,2px) skew(5deg);
    filter:hue-rotate(270deg);
  }
  100% {
    transform:translate(0,0);
    filter:hue-rotate(360deg);
  }
}

/* Anime-specific but still original VFX */
.vfx-eye {
  position:absolute;
  left:50%;
  top:50%;
  width:100px;
  height:100px;
  margin:-50px;
  border-radius:50%;
  border:6px solid #ff0000;
  box-shadow:0 0 35px #ff0000;
  animation:eyeSpin 3s linear infinite;
}

@keyframes eyeSpin {
  to { transform:rotate(360deg); }
}

.vfx-cloud {
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:100px;
  margin:-50px -130px;
  border-radius:50%;
  border:10px solid #fff;
  box-shadow:0 0 25px #fff;
  animation:cloudFloat 2s infinite alternate;
}

@keyframes cloudFloat {
  from { transform:scale(.9) rotate(-3deg); }
  to { transform:scale(1.1) rotate(3deg); }
}

.vfx-sword {
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:5px;
  background:linear-gradient(90deg,transparent,#fff,var(--c),#fff,transparent);
  box-shadow:0 0 20px var(--c);
  transform:translate(-50%,-50%) rotate(-25deg);
  animation:swordSlash .8s infinite alternate;
}

@keyframes swordSlash {
  from { transform:translate(-50%,-50%) rotate(-35deg) scaleX(.7); }
  to { transform:translate(-50%,-50%) rotate(25deg) scaleX(1.1); }
}
</style>
