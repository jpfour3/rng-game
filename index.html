<style>
/* ===== AURA VFX ENGINE ===== */

#equippedInfo{
  position:absolute;
  left:50%;
  top:calc(50% - 170px);
  transform:translateX(-50%);
  text-align:center;
  z-index:20;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 0 12px currentColor;
}

#equippedName{font-size:23px}
#equippedRarity{font-size:13px;margin-top:4px;opacity:.8}

.fx{
  position:absolute;
  pointer-events:none;
  transform-origin:center;
}

/* PARTICLES */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--c);
  box-shadow:0 0 12px var(--c);
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(60px) scale(.4);opacity:0}
  30%{opacity:1}
  100%{transform:translateY(-130px) scale(1.2);opacity:0}
}

/* BLOSSOM */
.blossom-tree{
  position:absolute;
  bottom:10%;
  width:130px;
  height:190px;
}
.blossom-tree:before{
  content:"";
  position:absolute;
  bottom:0;
  left:60px;
  width:15px;
  height:130px;
  background:#54372b;
}
.blossom-tree:after{
  content:"";
  position:absolute;
  top:0;
  left:5px;
  width:125px;
  height:95px;
  border-radius:50%;
  background:#ff9acb;
  box-shadow:
    30px -15px #ffb6d9,
    65px 5px #ff8fc5,
    90px -20px #ffc4e0;
}

.petal{
  position:absolute;
  width:9px;
  height:6px;
  background:#ff9acb;
  border-radius:100% 0;
  animation:petalFall 3s linear infinite;
}

@keyframes petalFall{
  from{transform:translateY(-100px) rotate(0)}
  to{transform:translateY(300px) rotate(360deg);opacity:0}
}

/* CRYSTALS */
.crystal{
  width:25px;
  height:60px;
  background:linear-gradient(135deg,#fff,#8beaff,#8d7cff);
  clip-path:polygon(50% 0,100% 35%,70% 100%,30% 100%,0 35%);
  filter:drop-shadow(0 0 15px #8beaff);
  animation:crystalFloat 2s infinite alternate;
}

@keyframes crystalFloat{
  from{transform:translateY(20px) rotate(-10deg)}
  to{transform:translateY(-25px) rotate(10deg)}
}

/* FIRE */
.fire{
  width:100px;
  height:150px;
  background:linear-gradient(#fff,#ffcc00,#ff5a00,#d90000);
  clip-path:polygon(
    50% 0,65% 28%,90% 12%,78% 55%,
    100% 70%,65% 100%,50% 75%,
    35% 100%,0 70%,22% 52%,10% 20%,38% 35%
  );
  filter:drop-shadow(0 0 25px #ff4500);
  animation:fire .25s infinite alternate;
}

@keyframes fire{
  from{transform:scaleY(.9)}
  to{transform:scaleY(1.12) skewX(4deg)}
}

/* WATER */
.water{
  width:250px;
  height:120px;
  border-radius:50%;
  border:12px solid #00bfff;
  box-shadow:0 0 25px #00bfff,inset 0 0 25px #00bfff;
  animation:water 1s infinite alternate;
}

@keyframes water{
  from{transform:scaleX(.8)}
  to{transform:scaleX(1.15) rotate(4deg)}
}

/* TORNADO */
.tornado{
  width:170px;
  height:250px;
  border-left:10px solid #aaa;
  border-right:10px solid #aaa;
  border-radius:50%;
  animation:tornado 1s linear infinite;
}

@keyframes tornado{
  to{transform:rotate(360deg)}
}

/* BLACK HOLE */
.blackhole{
  width:220px;
  height:220px;
  border-radius:50%;
  background:#000;
  box-shadow:
    0 0 20px #8b00ff,
    0 0 60px #6a00ff,
    0 0 100px #300060;
  animation:blackhole 2s infinite alternate;
}

@keyframes blackhole{
  from{transform:scale(.85)}
  to{transform:scale(1.15)}
}

/* RINGS */
.ring{
  width:230px;
  height:230px;
  border:5px solid var(--c);
  border-radius:50%;
  box-shadow:0 0 20px var(--c);
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LIGHTNING */
.bolt{
  width:8px;
  height:150px;
  background:#fff;
  clip-path:polygon(
    45% 0,100% 0,62% 42%,90% 42%,
    30% 100%,42% 55%,10% 55%
  );
  box-shadow:0 0 20px var(--c);
  animation:flash .12s infinite;
}

@keyframes flash{
  50%{opacity:0}
}

/* COMET */
.comet{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 25px #fff,0 0 50px var(--c);
  animation:comet 1s linear infinite;
}

@keyframes comet{
  from{transform:translate(-180px,-80px)}
  to{transform:translate(180px,80px)}
}

/* SHADOW */
.shadow{
  width:220px;
  height:260px;
  background:#050505;
  clip-path:polygon(50% 0,85% 25%,100% 100%,0 100%,15% 25%);
  filter:drop-shadow(0 0 25px #000);
  animation:shadow 2s infinite alternate;
}

@keyframes shadow{
  from{transform:scale(.9)}
  to{transform:scale(1.05)}
}

/* GALAXY */
.galaxy{
  width:300px;
  height:300px;
  border-radius:50%;
  background:
    radial-gradient(circle,#fff 1px,transparent 2px) 0 0/30px 30px,
    radial-gradient(circle,#b78cff 1px,transparent 2px) 15px 15px/40px 40px,
    #090014;
  box-shadow:0 0 50px #8b00ff;
  animation:galaxy 8s linear infinite;
}

@keyframes galaxy{
  to{transform:rotate(360deg)}
}

/* GLITCH */
.glitch{
  width:280px;
  height:280px;
  border:3px solid #00ffff;
  box-shadow:
    12px 0 #ff0055,
    -12px 0 #fff,
    0 0 40px #00ffff;
  animation:glitch .07s infinite steps(2);
}

@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(8px,-5px) skewX(10deg)}
  50%{transform:translate(-7px,4px)}
  75%{transform:translate(5px,3px) skewX(-8deg)}
}

/* STAR */
.star{
  width:180px;
  height:180px;
  background:#fff;
  clip-path:polygon(
    50% 0,61% 36%,100% 50%,61% 64%,
    50% 100%,39% 64%,0 50%,39% 36%
  );
  filter:drop-shadow(0 0 25px #fff);
  animation:star 2s infinite alternate;
}

@keyframes star{
  to{transform:rotate(45deg) scale(1.15)}
}

/* DOOM */
.doom{
  width:280px;
  height:280px;
  border:15px solid #600;
  box-shadow:0 0 50px #900,inset 0 0 50px #300;
  animation:doom 1s infinite alternate;
}

@keyframes doom{
  to{transform:rotate(45deg) scale(1.1)}
}

/* 1/1B */
.absolute-glitch{
  width:340px;
  height:340px;
  border:3px dashed #fff;
  box-shadow:
    15px 0 #00ffff,
    -15px 0 #ff0055,
    0 0 60px #fff;
  animation:ag .05s infinite steps(2);
}

@keyframes ag{
  0%{transform:translate(0) skew(0)}
  25%{transform:translate(15px,-8px) skew(12deg)}
  50%{transform:translate(-12px,9px) skew(-15deg)}
  75%{transform:translate(8px,4px)}
}
</style>
