<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Roll</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;
  overflow:hidden;transition:background .6s
}
#game{height:100vh;position:relative;overflow:hidden}
#stage{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
#vfx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#top{
 position:absolute;left:18px;top:15px;z-index:20;font-size:14px;
 background:#ffffffdd;padding:12px;border-radius:50%;width:130px;height:130px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;box-shadow:0 4px 15px #0002;border:2px solid #111
}
#stick{width:110px;height:210px;position:relative;z-index:8}
.head{
 position:absolute;left:28px;top:0;width:55px;height:55px;
 border:6px solid #111;border-radius:50%;background:#fff;z-index:2
}
.body{position:absolute;left:53px;top:52px;width:6px;height:90px;background:#111}
.arm,.leg{
 position:absolute;left:56px;width:65px;height:6px;background:#111;
 transform-origin:left;transition:.3s
}
.a1{top:70px;transform:rotate(145deg)}
.a2{top:70px;transform:rotate(35deg)}
.l1{top:138px;transform:rotate(115deg)}
.l2{top:138px;transform:rotate(65deg)}

#equipped{
 position:absolute;left:50%;top:calc(50% - 155px);transform:translateX(-50%);
 text-align:center;z-index:15;pointer-events:none;white-space:nowrap;
 text-shadow:0 2px 8px #fff
}
#equippedName{font-size:21px;font-weight:900}
#equippedRarity{font-size:13px;font-weight:bold;opacity:.8}

#result{
 position:absolute;top:57%;left:50%;transform:translate(-50%,-50%);
 text-align:center;font-size:28px;font-weight:bold;opacity:0;
 transition:.2s;pointer-events:none;z-index:22;text-shadow:0 2px 12px #fff
}
#result.show{opacity:1}

#admin{position:absolute;right:18px;top:15px;z-index:25;display:flex;gap:5px}
#admin input{width:90px;padding:7px;border:1px solid #aaa;border-radius:7px}
#admin button{padding:7px 9px;border:0;border-radius:7px;background:#111;color:#fff}

#menu{
 position:absolute;right:18px;top:50%;transform:translateY(-50%);
 width:48px;height:75px;border:0;border-radius:12px;background:#111;color:#fff;
 font-size:25px;z-index:25
}
#panel{
 position:absolute;right:-440px;top:0;width:440px;height:100%;
 background:#f4f4f4;padding:18px;overflow:auto;transition:.3s;
 z-index:30;box-shadow:-5px 0 20px #0002
}
#panel.open{right:0}
.close{float:right;border:0;background:none;font-size:28px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:35px 0 15px}
.tab{border:0;padding:8px;border-radius:7px}
.tab.active{background:#111;color:#fff}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid #ccc;border-radius:9px;padding:10px;margin:8px 0}
.card.locked{opacity:.5}
button{cursor:pointer}
.action{border:0;border-radius:6px;padding:7px;margin-top:5px}
.craft{background:#111;color:#fff;width:100%}
#bottomInfo{position:absolute;left:18px;bottom:95px;z-index:20;font-size:14px}
#buttons{
 position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
 display:flex;gap:10px;z-index:20
}
.roll{
 width:125px;height:55px;background:#111;color:#fff;border:0;border-radius:12px;
 font-weight:bold
}
.small{font-size:12px;opacity:.7}
#toast{
 position:absolute;top:18px;left:50%;transform:translateX(-50%);
 background:#111;color:#fff;padding:10px 18px;border-radius:9px;
 opacity:0;z-index:50;transition:opacity .3s;pointer-events:none
}

/* ---------- VFX BASE ---------- */
.fx{position:absolute;pointer-events:none}
.orbit{border-radius:50%;animation:orbit 4s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.float{animation:float 2s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-18px)}}
.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18);opacity:.45}}
@keyframes fall{to{transform:translateY(260px) rotate(180deg);opacity:0}}
@keyframes rise{to{transform:translateY(-260px);opacity:0}}
@keyframes drift{to{transform:translate(120px,-80px);opacity:0}}
@keyframes flash{0%,90%,100%{opacity:0}95%{opacity:1}}
@keyframes glitch{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-8px,3px)}
  40%{transform:translate(8px,-2px)}
  60%{transform:translate(-4px,-5px)}
  80%{transform:translate(5px,4px)}
}

.particle{width:7px;height:7px;border-radius:50%;position:absolute}

/* Visual Effects Styles */
.pebble{width:13px;height:9px;background:#777;border-radius:60% 40%;animation:orbit 4s linear infinite}
.pebbleDust{width:5px;height:5px;background:#aaa;border-radius:50%;animation:rise 1.7s infinite}
.leaf{width:12px;height:7px;background:#36a852;border-radius:100% 0;animation:fall 3s linear infinite}
.wind{width:75px;height:30px;border-top:3px solid #ddd;border-radius:50%;animation:drift 2s linear infinite}
.drop{width:9px;height:13px;background:#36bdf5;border-radius:60% 60% 70% 70%;animation:fall 2s linear infinite}

.dust{width:6px;height:6px;background:#9a7950;border-radius:50%;animation:drift 2s linear infinite}
.glowRing{width:190px;height:190px;border:3px solid #fff4a3;border-radius:50%;box-shadow:0 0 35px #fff4a3;animation:pulse 1.4s infinite alternate}
.ember{width:6px;height:13px;background:#ff7a00;border-radius:50%;box-shadow:0 0 10px #ff4500;animation:rise 2s linear infinite}
.frost{width:28px;height:28px;border:3px solid #bdf5ff;transform:rotate(45deg);box-shadow:0 0 12px #8eeaff}
.flame{width:32px;height:55px;background:linear-gradient(#fff,#ffb000,#f30);border-radius:50% 50% 45% 45%;filter:blur(1px);animation:pulse .45s infinite alternate}
.mist{width:180px;height:55px;background:#fff8;border-radius:50%;filter:blur(12px);animation:float 2s infinite alternate}
.stone{width:18px;height:15px;background:#666;border-radius:4px;animation:orbit 3s linear infinite}
.bloom{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#ffd1ec 0 25%,#ff69b4 27% 55%,transparent 58%);animation:float 2s infinite alternate}
.cloud{width:100px;height:35px;background:#fff;border-radius:50px;box-shadow:25px 0 0 #fff,-25px 5px 0 #fff;animation:float 2s infinite alternate}
.wave{width:180px;height:70px;border:7px solid #19aee8;border-color:#19aee8 transparent transparent;border-radius:50%;animation:spin 2s linear infinite}
.shadowSmoke{width:180px;height:180px;background:#1118;border-radius:50%;filter:blur(15px);animation:float 2s infinite alternate}

.crystal{width:18px;height:42px;background:linear-gradient(135deg,#fff,#73e8ff,#b86cff);clip-path:polygon(50% 0,100% 25%,75% 100%,25% 100%,0 25%);animation:orbit 5s linear infinite}
.venom{width:50px;height:80px;background:#8b20c7aa;border-radius:50%;filter:blur(10px);animation:float 1.3s infinite alternate}
.sun{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd21c,#ff7200);box-shadow:0 0 50px #ff9d00;animation:pulse 1s infinite alternate}
.moon{width:85px;height:85px;border-radius:50%;background:#dffaff;box-shadow:0 0 35px #9eeaff;position:absolute}

.comet{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 25px #fff;animation:orbit 3s linear infinite}

.tempest{width:280px;height:280px;border:7px dashed #9eeaff;border-radius:50%;animation:spin 1s linear infinite}
.abyss{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#000 0 45%,#54106f 48%,transparent 70%);box-shadow:0 0 45px #5b0088;animation:spin 4s linear infinite}
.eclipse{width:105px;height:105px;border-radius:50%;background:#050505;border:6px solid #ffd34e;box-shadow:0 0 35px #ffd34e}

.star{color:#fff;font-size:18px;animation:float 2s infinite alternate}

.aurora{width:300px;height:180px;border-radius:50%;border-top:15px solid #5fffc8;border-left:15px solid #8c5cff;filter:blur(4px);animation:spin 7s linear infinite}
.speed{width:240px;height:5px;background:#fff;box-shadow:0 0 12px #fff;animation:drift .5s linear infinite}

.shock{width:320px;height:320px;border:15px solid #111;border-radius:50%;box-shadow:0 0 30px #ffd34e;animation:pulse .8s infinite alternate}
.genesis{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd34e,#ff69b4,#5b5cff,transparent 70%);animation:pulse 1.5s infinite alternate}
.infinity{font-size:180px;color:#8b5cff;line-height:1;animation:spin 5s linear infinite}
.rune{font-size:55px;color:#d8a9ff;animation:spin 4s linear infinite}
.planet{width:40px;height:40px;border-radius:50%;background:#55aaff;box-shadow:0 0 15px #55aaff;animation:orbit 4s linear infinite}
.astral{width:100px;height:170px;border:3px solid #bcdcff;border-radius:45%;opacity:.35;animation:float 2s infinite alternate}
.heavenBeam{width:35px;height:320px;background:#fff;filter:blur(8px);animation:pulse 1s infinite alternate}
.doom{width:260px;height:180px;background:#30000a99;border-radius:50%;filter:blur(15px);animation:pulse 1s infinite alternate}
.crack{width:280px;height:4px;background:#fff;box-shadow:0 0 15px #fff;transform:rotate(-15deg);animation:glitch .7s infinite}
.reality{width:250px;height:250px;border:4px dashed #fff;animation:glitch .3s infinite}
.ancient{font-size:65px;color:#b88732;animation:spin 5s linear infinite}
.seal{width:170px;height:170px;border:5px solid #6b19a8;border-radius:50%;animation:spin 3s linear infinite}
.immortal{width:180px;height:180px;border:10px solid #ffd34e;border-radius:50%;box-shadow:0 0 30px #ffd34e;animation:pulse 1s infinite alternate}
.transRing{width:250px;height:250px;border:4px solid #dfffff;border-radius:50%;animation:spin 4s linear infinite}
.absolute{width:240px;height:240px;border:5px solid #111;border-radius:50%;animation:spin 6s linear infinite}
.chain{width:100px;height:25px;border:6px solid #777;border-radius:20px;animation:drift 1s infinite}
.lines{width:360px;height:3px;background:#55aaff;box-shadow:0 0 12px #55aaff;animation:drift 1s linear infinite}
.paradoxA,.paradoxB{width:180px;height:180px;border:6px solid;border-radius:50%;animation:spin 2s linear infinite}
.universe{width:65px;height:65px;border-radius:50%;background:radial-gradient(circle,#fff,#7c4dff,transparent 70%);animation:orbit 3s linear infinite}
.finalClock{width:190px;height:190px;border:8px solid #222;border-radius:50%}
.godRing{width:300px;height:300px;border:12px solid #ffd34e;border-radius:50%;box-shadow:0 0 40px #ffd34e;animation:spin 5s linear infinite}
.chosenMark{width:170px;height:170px;border:7px solid #fff;border-radius:50%;box-shadow:0 0 30px #fff;animation:pulse 1.5s infinite alternate}
.firstRune{font-size:100px;color:#d7a63b;animation:spin 7s linear infinite}
.beyond{width:400px;height:300px;border:3px dotted #fff;animation:glitch .4s infinite}
.xRing{width:330px;height:330px;border:7px double #55aaff;border-radius:50%;animation:spin 1.5s linear infinite}

.origin{width:45px;height:45px;border-radius:50%;background:#fff;box-shadow:0 0 40px #fff;animation:origin 2s infinite}

.endSphere{width:260px;height:260px;border-radius:50%;background:#000;box-shadow:0 0 40px #111;animation:pulse 3s infinite alternate}
.nullFx{width:230px;height:230px;border:2px solid #000;border-radius:50%;animation:pulse 2s infinite alternate}
.impossible{width:230px;height:230px;border:4px solid #111;transform:rotate(45deg);animation:glitch .25s infinite}
.infiniteVoid{width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#000 0 35%,#270052 50%,transparent 72%);box-shadow:0 0 50px #7200c9;animation:spin 8s linear infinite}

.gojoBlue{background:#29c8ff;color:#29c8ff}

 position:absolute;left:56px;top:70px;height:7px;background:#111;
 transform-origin:left;animation:stretchArm 1.5s ease-in-out infinite alternate
}
@keyframes stretchArm{
 0%{width:35px}
 100%{width:210px}
}

.smoke{width:70px;height:70px;border:8px solid #fff;border-radius:50%;filter:blur(5px);animation:float 1.2s infinite alternate}
.sword{width:9px;height:120px;background:#ccc;border:2px solid #555;transform:rotate(25deg)}

</head>

<body>
<div id="game">

<div id="top">
<b>Rarest:</b><span id="rarest">None</span><br>
<b>Rolls:</b><span id="rolls">0</span>
</div>

<div id="admin">
<input id="adminInput" placeholder="admin">
<button onclick="adminToggle()">OK</button>
</div>

<div id="bottomInfo">
<b>Biome:</b> <span id="biome">Plains</span><br>
<span id="timer" class="small"></span>
</div>

<div id="stage">
<div id="vfx"></div>

<div id="equipped">
<div id="equippedName">Nothing Equipped</div>
<div id="equippedRarity"></div>
</div>

<div id="stick">
<div class="head" id="head"></div>
<div class="body"></div>
<div class="arm a1" id="arm1"></div>
<div class="arm a2" id="arm2"></div>
<div class="leg l1"></div>
<div class="leg l2"></div>
</div>
</div>

<button id="menu" onclick="toggleMenu()">➜</button>

<div id="buttons">
<button class="roll" onclick="toggleAuto()" id="auto">AUTO ROLL<br><small>50 rolls</small></button>
<button class="roll" onclick="normalRoll()">ROLL<br><small>1 sec</small></button>
<button class="roll" onclick="fastRoll()" id="fast">FAST ROLL<br><small>150 rolls</small></button>
</div>

<div id="result"></div>
<div id="toast"></div>

<div id="panel">
<button class="close" onclick="toggleMenu()">×</button>
<h2>INDEX</h2>

<div class="tabs">
<button class="tab active" onclick="showTab('auras',this)">Auras</button>
<button class="tab" onclick="showTab('potions',this)">Potions</button>
<button class="tab" onclick="showTab('gloves',this)">Gloves</button>
<button class="tab" onclick="showTab('biomes',this)">Biomes</button>
</div>

<div id="auras" class="section active"></div>
<div id="potions" class="section"></div>
<div id="gloves" class="section"></div>
<div id="biomes" class="section"></div>
</div>
</div>

];

const auras=names.map((name,i)=>({

/* ================= BIOMES ================= */

const biomes=[
{name:"Plains",rare:1,time:120,luck:1,bg:"#fff"},
{name:"Forest",rare:2,time:100,luck:50,bg:"#dff5df"},
{name:"Desert",rare:4,time:90,luck:250,bg:"#f8e8b0"},
{name:"Rain",rare:6,time:80,luck:1000,bg:"#cbdcf0"},

const potions=[
["Lucky Brew",5,[0,1,2]],["Fortune Tonic",15,[3,5,7]],
["Golden Elixir",35,[8,10,12]],["Mystic Potion",75,[15,17,20]],
["Void Serum",150,[22,25,28]],["Celestial Potion",300,[32,35,38]],
["Infinity Elixir",600,[42,45,48]],["Godly Potion",1200,[52,55,58]],
["Reality Potion",3000,[62,65,68]],["10K LUCK ELIXIR",10000,[72,73,74,75,76,77,78,79]]
].map(x=>({name:x[0],luck:x[1],recipe:x[2]}));

const gloves=[
["Cloth Glove",2,[0,2,4]],["Iron Glove",5,[5,7,9]],
["Golden Glove",10,[10,12,15]],["Crystal Glove",20,[17,19,21]],
["Shadow Glove",40,[25,27,29]],["Void Glove",80,[32,34,36]],
["Galaxy Glove",160,[40,42,44]],["Divine Glove",350,[50,52,54]],
["Reality Glove",800,[60,62,64]],["Infinite Glove",2000,[68,70,73]]
].map(x=>({name:x[0],luck:x[1],recipe:x[2]}));

let inventory={
 potions:Array(10).fill(0),
 gloves:Array(10).fill(0)
};

let autoCraft={potion:null,glove:null};
let rolls=0,equippedAura=null,equippedGlove=null,potionLuck=0;
let auto=false,busy=false,rarest=-1,admin=false;
let currentBiome=biomes[0],biomeTime=currentBiome.time;

/* ================= SAVE ================= */

function save(){
 if(admin)return;
 localStorage.setItem("auraRoll",JSON.stringify({
  auras,inventory,autoCraft,rolls,equippedAura,equippedGlove,
  potionLuck,currentBiome:currentBiome.name,biomeTime,rarest
 }));
}

function load(){
 let s=localStorage.getItem("auraRoll");
 if(!s)return;
 try{
  let d=JSON.parse(s);
  if(d.auras)d.auras.forEach((a,i)=>{
   if(auras[i])Object.assign(auras[i],a);
  });
  inventory=d.inventory||inventory;
  autoCraft=d.autoCraft||autoCraft;
  rolls=d.rolls||0;
  equippedAura=d.equippedAura??null;
  equippedGlove=d.equippedGlove??null;
  potionLuck=d.potionLuck||0;
  rarest=d.rarest??-1;
  currentBiome=biomes.find(b=>b.name===d.currentBiome)||biomes[0];
  biomeTime=d.biomeTime||currentBiome.time;
 }catch(e){}
}

/* ================= ADMIN ================= */

function adminToggle(){
 let input=document.getElementById("adminInput");
 if(input.value.toLowerCase()==="rocky"){
  admin=!admin;
  if(admin){
   auras.forEach(a=>{a.owned=999999;a.total=999999});
   inventory.potions.fill(999);
   inventory.gloves.fill(999);
   equippedAura=79;
   equippedGlove=9;
   toast("ADMIN MODE ON — NOTHING SAVES");
  }else{
   load();
   toast("ADMIN MODE OFF — SAVING RESTORED");
  }
  update();
  if(equippedAura!==null)vfx(equippedAura);
 }
}

/* ================= ROLLS ================= */

function totalLuck(){
 let glove=equippedGlove===null?0:gloves[equippedGlove].luck;
 let aura=equippedAura===null?0:(equippedAura+1)*.02;
 return (1+glove+aura+potionLuck)*currentBiome.luck;
}

function chooseAura(){
 let L=totalLuck();
 let weights=auras.map(a=>{
  // Scale effectively so Luck reduces item thresholds and properly boosts rare drops
  let effectiveOdds=Math.max(1, a.odds/L);
  return 1/effectiveOdds;
 });
 let total=weights.reduce((a,b)=>a+b,0);
 let r=Math.random()*total;
 for(let i=0;i<weights.length;i++){
  r-=weights[i];
  if(r<=0)return i;
 }
 return 0;
}

function normalRoll(){
 if(busy)return;
 busy=true;
 setTimeout(()=>{doRoll();busy=false},1000);
}

function fastRoll(){
 if(rolls<150){toast("Fast Roll unlocks at 150 rolls");return}
 if(busy)return;
 busy=true;
 setTimeout(()=>{doRoll();busy=false},200);
}

function doRoll(){
 rolls++;
 let id=chooseAura();

 auras[id].owned++;
 auras[id].total++;

 if(id>rarest)rarest=id;
 potionLuck=0;

 showResult(
  "✨ "+auras[id].name+" ✨",
  formatOdds(auras[id])
 );

 autoCraftCheck();
 update();
 save();
}

function toggleAuto(){
 if(rolls<50){toast("Auto Roll unlocks at 50 rolls");return}
 auto=!auto;
 update();
 if(auto)autoLoop();
}

function autoLoop(){
 if(!auto)return;
 setTimeout(()=>{
  if(auto){doRoll();autoLoop()}
 },rolls>=150?200:1000);
}

/* ================= ITEMS ================= */

function hasRecipe(recipe){
 return recipe.every(i=>auras[i]&&auras[i].owned>0);
}

function consume(recipe){
 recipe.forEach(i=>auras[i].owned--);
}

function craft(type,i){
 let item=type==="potion"?potions[i]:gloves[i];
 if(!hasRecipe(item.recipe)){toast("Missing required auras");return}
 consume(item.recipe);

 let key=type==="potion"?"potions":"gloves";
 inventory[key][i]++;

 toast("Crafted "+item.name);
 update();
 save();
}

function usePotion(i){
 if(inventory.potions[i]<=0)return;
 inventory.potions[i]--;
 potionLuck=potions[i].luck/100;
 toast(potions[i].name+" activated");
 update();
 save();
}

function equipGlove(i){
 if(inventory.gloves[i]<=0){toast("You don't own this glove");return}
 equippedGlove=i;
 toast("Equipped "+gloves[i].name);
 update();
 save();
}

function equipAura(i){
 if(auras[i].owned<=0){toast("You don't own this aura");return}
 equippedAura=i;
 vfx(i);
 toast("Equipped "+auras[i].name);
 update();
 save();
}

function autoCraftSet(type,i){
 autoCraft[type]=autoCraft[type]===i?null:i;
 update();
 save();
}

function autoCraftCheck(){
 [
  ["potion",potions,"potions"],
  ["glove",gloves,"gloves"]
 ].forEach(([type,list,key])=>{
  let i=autoCraft[type];
  if(i!==null&&i!==undefined&&hasRecipe(list[i].recipe)){
   consume(list[i].recipe);
   inventory[key][i]++;
  }
 });
}

/* ================= BIOMES ================= */

function spawnBiome(b){
 currentBiome=b;
 biomeTime=b.time;
 document.body.style.background=b.bg;
 toast("🌎 "+b.name+" — x"+b.luck.toLocaleString()+" LUCK");
 update();
 save();
}

setInterval(()=>{
 biomeTime--;
 if(biomeTime<=0){
  let next=biomes[Math.floor(Math.random()*biomes.length)];
  spawnBiome(next);
 }
 let t=document.getElementById("timer");
 if(t)t.innerText=biomeTime+"s left";
},1000);

/* ================= VFX ENGINE ================= */

function vfx(id){
 let v=document.getElementById("vfx");
 v.innerHTML="";
 let arm1=document.getElementById("arm1");
 if(arm1) arm1.className="arm a1";

 let name=auras[id].name;
 document.getElementById("equippedName").innerText=name;
 document.getElementById("equippedRarity").innerText=formatOdds(auras[id]);

 if(name==="Luffy"){
  let el=document.createElement("div");
  el.className="stretchArm";
  v.appendChild(el);
  if(arm1) arm1.style.display="none";
 } else {
  if(arm1) arm1.style.display="block";
 }
}

/* ================= UI & RENDERING ================= */

function toggleMenu(){
 document.getElementById("panel").classList.toggle("open");
}

function showTab(id,button){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 button.classList.add("active");
}

function toast(msg){
 let t=document.getElementById("toast");
 t.innerText=msg;
 t.style.opacity="1";
 setTimeout(()=>t.style.opacity="0",2000);
}

function formatOdds(a){
 if(a.name==="1/0")return"1/1B";
 return"1/"+a.odds.toLocaleString();
}

function showResult(title,rarity){
 let r=document.getElementById("result");
 r.innerHTML=title+"<br><span class='small'>"+rarity+"</span>";
 r.classList.add("show");
 setTimeout(()=>r.classList.remove("show"),1500);
}

function recipeText(recipe){
 return recipe.map(i=>{
  let a=auras[i];
  return(a?a.name:"?")+" — "+(a?a.owned:0)+" owned";
 }).join("<br> + ");
}

function renderAuras(){
 let html="<h3>AURAS — "+auras.length+"</h3>";
 auras.forEach((a,i)=>{
  let locked=a.owned<=0;
  html+=`
  <div class="card ${locked?'locked':''}">
   <b>${a.name}</b> (${formatOdds(a)})<br>
   Owned: ${a.owned} (Total: ${a.total})<br>
   ${!locked?`<button class="action" onclick="equipAura(${i})">Equip</button>`:''}
  </div>`;
 });
 document.getElementById("auras").innerHTML=html;
}

function renderPotions(){
 let html="<h3>POTIONS</h3>";
 potions.forEach((p,i)=>{
  let count=inventory.potions[i]||0;
  let can=hasRecipe(p.recipe);
  html+=`
  <div class="card">
   <b>${p.name}</b> (+${p.luck}% Luck)<br>
   Owned: ${count}<br>
   <small>Requires:<br>${recipeText(p.recipe)}</small><br>
   <button class="action craft" onclick="craft('potion',${i})">Craft</button>
   ${count>0?`<button class="action" onclick="usePotion(${i})">Use</button>`:''}
  </div>`;
 });
 document.getElementById("potions").innerHTML=html;
}

function renderGloves(){
 let html="<h3>GLOVES</h3>";
 gloves.forEach((g,i)=>{
  let count=inventory.gloves[i]||0;
  html+=`
  <div class="card">
   <b>${g.name}</b> (+${g.luck} Luck)<br>
   Owned: ${count}<br>
   <small>Requires:<br>${recipeText(g.recipe)}</small><br>
   <button class="action craft" onclick="craft('glove',${i})">Craft</button>
   ${count>0?`<button class="action" onclick="equipGlove(${i})">Equip</button>`:''}
  </div>`;
 });
 document.getElementById("gloves").innerHTML=html;
}

function renderBiomes(){
 let html="<h3>BIOMES</h3>";
 biomes.forEach(b=>{
  html+=`
  <div class="card">
   <b>${b.name}</b><br>
   Luck Multiplier: x${b.luck.toLocaleString()}<br>
   Duration: ${b.time}s
  </div>`;
 });
 document.getElementById("biomes").innerHTML=html;
}

function update(){
 document.getElementById("rolls").innerText=rolls;
 document.getElementById("rarest").innerText=rarest>=0?auras[rarest].name:"None";
 document.getElementById("biome").innerText=currentBiome.name;

 renderAuras();
 renderPotions();
 renderGloves();
 renderBiomes();
}

window.onload=function(){
 load();
 update();
 if(equippedAura!==null)vfx(equippedAura);
};
</script>
