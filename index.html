<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aura Roll</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #111;
        overflow: hidden;
        transition: background 0.6s;
      }
      #game {
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      #stage {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #stick {
        width: 110px;
        height: 210px;
        position: relative;
        z-index: 8;
      }
      .head {
        position: absolute;
        left: 28px;
        top: 0;
        width: 55px;
        height: 55px;
        border: 6px solid #111;
        border-radius: 50%;
        background: #fff;
      }
      .body {
        position: absolute;
        left: 53px;
        top: 52px;
        width: 6px;
        height: 90px;
        background: #111;
      }
      .arm,
      .leg {
        position: absolute;
        left: 56px;
        width: 65px;
        height: 6px;
        background: #111;
        transform-origin: left;
      }
      .a1 {
        top: 70px;
        transform: rotate(145deg);
      }
      .a2 {
        top: 70px;
        transform: rotate(35deg);
      }
      .l1 {
        top: 138px;
        transform: rotate(115deg);
      }
      .l2 {
        top: 138px;
        transform: rotate(65deg);
      }

      #vfx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        overflow: hidden;
      }
      #top {
        position: absolute;
        left: 18px;
        top: 15px;
        z-index: 20;
        font-size: 14px;
      }
      #bottomInfo {
        position: absolute;
        left: 18px;
        bottom: 95px;
        z-index: 20;
        font-size: 14px;
      }

      #admin {
        position: absolute;
        right: 18px;
        top: 15px;
        z-index: 25;
        display: flex;
        gap: 5px;
      }
      #admin input {
        width: 90px;
        padding: 7px;
        border: 1px solid #aaa;
        border-radius: 7px;
      }
      #admin button {
        padding: 7px 9px;
        border: 0;
        border-radius: 7px;
        background: #111;
        color: #fff;
      }

      #menu {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 75px;
        border: 0;
        border-radius: 12px;
        background: #111;
        color: #fff;
        font-size: 25px;
        z-index: 25;
      }

      #panel {
        position: absolute;
        right: -440px;
        top: 0;
        width: 440px;
        height: 100%;
        background: #f4f4f4;
        padding: 18px;
        overflow: auto;
        transition: 0.3s;
        z-index: 30;
        box-shadow: -5px 0 20px #0002;
      }
      #panel.open {
        right: 0;
      }

      .close {
        float: right;
        border: 0;
        background: none;
        font-size: 28px;
      }

      .tabs {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 35px 0 15px;
      }
      .tab {
        border: 0;
        padding: 8px;
        border-radius: 7px;
      }
      .tab.active {
        background: #111;
        color: #fff;
      }

      .section {
        display: none;
      }
      .section.active {
        display: block;
      }

      .card {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 9px;
        padding: 10px;
        margin: 8px 0;
      }
      .card.locked {
        opacity: 0.5;
      }

      button {
        cursor: pointer;
      }

      .action {
        border: 0;
        border-radius: 6px;
        padding: 7px;
        margin-top: 5px;
      }

      .craft {
        background: #111;
        color: #fff;
        width: 100%;
      }

      #buttons {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 20;
      }

      .roll {
        width: 125px;
        height: 55px;
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 12px;
        font-weight: bold;
      }

      .roll:disabled {
        opacity: 0.4;
      }

      #result {
        position: absolute;
        top: 57%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        z-index: 22;
        text-shadow: 0 2px 12px #fff;
      }

      #result.show {
        opacity: 1;
      }

      .small {
        font-size: 12px;
        opacity: 0.7;
      }

      #toast {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #111;
        color: #fff;
        padding: 99px 14px;
        border-radius: 9px;
        opacity: 0;
        z-index: 50;
        transition: opacity 0.3s;
        pointer-events: none;
      }

      /* VFX Styles */
      .spark {
        width: 5px;
        height: 5px;
        background: #fff;
        box-shadow: 0 0 10px #fff;
        border-radius: 50%;
        position: absolute;
        animation: sparkFly 1s linear forwards;
      }

      @keyframes sparkFly {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), var(--y)) scale(0);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="game">
      <div id="top">
        <b>Rarest Rolled:</b>
        <span id="rarest">None</span>
        <br />
        <b>Total Rolls:</b>
        <span id="rolls">0</span>
      </div>

      <div id="admin">
        <input id="adminInput" placeholder="admin" />
        <button onclick="adminToggle()">OK</button>
      </div>

      <div id="bottomInfo">
        <b>Biome:</b>
        <span id="biome">Plains</span>
        <br />
        <span id="timer" class="small"></span>
      </div>

      <div id="stage">
        <div id="vfx"></div>

        <div id="stick">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm a1"></div>
          <div class="arm a2"></div>
          <div class="leg l1"></div>
          <div class="leg l2"></div>
        </div>
      </div>

      <button id="menu" onclick="toggleMenu()">➜</button>

      <div id="buttons">
        <button class="roll" onclick="toggleAuto()" id="auto">
          AUTO ROLL
          <br />
          <small>50 rolls</small>
        </button>

        <button class="roll" onclick="normalRoll()">
          ROLL
          <br />
          <small>1 sec</small>
        </button>

        <button class="roll" onclick="fastRoll()" id="fast">
          FAST ROLL
          <br />
          <small>150 rolls</small>
        </button>
      </div>

      <div id="result"></div>
      <div id="toast"></div>

      <div id="panel">
        <button class="close" onclick="toggleMenu()">×</button>

        <h2>INDEX</h2>

        <div class="tabs">
          <button class="tab active" onclick="showTab('auras', this)">Auras</button>
          <button class="tab" onclick="showTab('potions', this)">Potions</button>
          <button class="tab" onclick="showTab('gloves', this)">Gloves</button>
          <button class="tab" onclick="showTab('biomes', this)">Biomes</button>
          <button class="tab" onclick="showTab('leaderboard', this)">Leaderboard</button>
        </div>

        <div id="auras" class="section active"></div>
        <div id="potions" class="section"></div>
        <div id="gloves" class="section"></div>
        <div id="biomes" class="section"></div>
        <div id="leaderboard" class="section"></div>
      </div>
    </div>

    <script>
      /* AURAS */
      const names = [
        "Spark", "Pebble", "Leaf", "Breeze", "Drop", "Dew", "Dust", "Glow",
        "Ember", "Frost", "Flame", "Mist", "Stone", "Bloom", "Cloud", "Wave",
        "Shadow", "Thunder", "Crystal", "Venom", "Solar", "Lunar", "Comet", "Void",
        "Inferno", "Glacier", "Tempest", "Abyss", "Eclipse", "Phantom", "Prism", "Nebula",
        "Gravity", "Starlight", "Bloodmoon", "Aurora", "Overdrive", "Celestial", "Oblivion", "Divine",
        "Galaxy", "Singularity", "Eternal", "Rift", "Chronos", "Seraph", "Omega", "Genesis",
        "Infinity", "Mythic", "Cosmic", "Astral", "Heavenly", "Doom", "Worldbreaker", "Reality",
        "Ancient", "Forbidden", "Immortal", "Transcendent", "Absolute", "Unbound", "Limitless", "Paradox",
        "Omniversal", "Finality", "Godly", "The Chosen", "The First", "Beyond", "Limitless X", "Eternal Flame",
        "Origin", "The End", "Null", "Impossible", "Infinite Void", "Creator", "Absolute Zero", "1/0",
        "Gojo", "Itachi", "Naruto", "Jiraiya", "Luffy", "Gear 5", "Zoro", "Jinbei", "Sanji",
        "Kakashi", "Sasuke", "Itadori", "Mahoraga", "Yuta"
      ];

      const odds = [
        5, 12, 20, 35, 50, 70, 90, 120, 160, 210, 275, 350, 450, 575, 725, 900, 1100, 1350, 1650, 2000, 2400, 2900,
        3500, 4200, 5000, 6000, 7200, 8600, 10000, 12000, 14500, 17500, 21000, 25000, 30000, 36000, 43000, 51000, 60000,
        70000, 82000, 95000, 110000, 130000, 150000, 175000, 200000, 230000, 260000, 300000, 350000, 400000, 460000,
        525000, 600000, 700000, 800000, 950000, 1100000, 1300000, 1500000, 1800000, 2100000, 2500000, 3000000, 3500000,
        4200000, 5000000, 6000000, 7500000, 9000000, 11000000, 14000000, 18000000, 25000000, 50000000, 100000000,
        1000000000, 10000000000, 0, 25000000000, 50000000000, 100000000000, 250000000000, 500000000000, 1000000000000,
        2500000000000, 5000000000000, 10000000000000, 25000000000000, 50000000000000, 100000000000000, 250000000000000,
        1000000000000000
      ];

      const auras = names.map((name, i) => ({
        name,
        odds: odds[i] || 1000000000000000,
        owned: 0,
        total: 0
      }));

      /* BIOMES */
      const biomes = [
        { name: "Plains", rare: 1, time: 120, luck: 1, bg: "#fff" },
        { name: "Forest", rare: 2, time: 100, luck: 3, bg: "#dff5df" },
        { name: "Desert", rare: 4, time: 90, luck: 5, bg: "#f8e8b0" },
        { name: "Rain", rare: 6, time: 80, luck: 10, bg: "#cbdcf0" },
        { name: "Water", rare: 8, time: 70, luck: 20, bg: "#b8e8ff" },
        { name: "Ocean", rare: 12, time: 60, luck: 35, bg: "#55bfff" },
        { name: "Tsunami", rare: 20, time: 50, luck: 60, bg: "#3a91cf" },
        { name: "Storm", rare: 30, time: 45, luck: 90, bg: "#555b79" },
        { name: "Volcano", rare: 45, time: 40, luck: 130, bg: "#e0714f" },
        { name: "Aurora", rare: 60, time: 35, luck: 200, bg: "#7d86df" },
        { name: "Void", rare: 100, time: 30, luck: 350, bg: "#181225" },
        { name: "Galaxy", rare: 200, time: 25, luck: 600, bg: "#15102f" },
        { name: "Heaven", rare: 400, time: 22, luck: 1000, bg: "#e8e8ff" },
        { name: "Reality", rare: 800, time: 20, luck: 2500, bg: "#bbb" },
        { name: "The End", rare: 1500, time: 20, luck: 10000, bg: "#080808" }
      ];

      /* CRAFTING ITEMS */
      const potions = [
        ["Lucky Brew", 5, [0, 1, 2]],
        ["Fortune Tonic", 15, [3, 5, 7]],
        ["Golden Elixir", 35, [8, 10, 12]],
        ["Mystic Potion", 75, [15, 17, 20]],
        ["Void Serum", 150, [22, 25, 28]],
        ["Celestial Potion", 300, [32, 35, 38]],
        ["Infinity Elixir", 600, [42, 45, 48]],
        ["Godly Potion", 1200, [52, 55, 58]],
        ["Reality Potion", 3000, [62, 65, 68]],
        ["10K LUCK ELIXIR", 10000, [72, 73, 74, 75, 76, 77, 78, 79]]
      ].map((x) => ({ name: x[0], luck: x[1], recipe: x[2] }));

      const gloves = [
        ["Cloth Glove", 2, [0, 2, 4]],
        ["Iron Glove", 5, [5, 7, 9]],
        ["Golden Glove", 10, [10, 12, 15]],
        ["Crystal Glove", 20, [17, 19, 21]],
        ["Shadow Glove", 40, [25, 27, 29]],
        ["Void Glove", 80, [32, 34, 36]],
        ["Galaxy Glove", 160, [40, 42, 44]],
        ["Divine Glove", 350, [50, 52, 54]],
        ["Reality Glove", 800, [60, 62, 64]],
        ["Infinite Glove", 2000, [68, 70, 73]]
      ].map((x) => ({ name: x[0], luck: x[1], recipe: x[2] }));

      const randomizers = [
        ["Basic Biome Randomizer", 10, [8, 9, 10]],
        ["Rare Biome Randomizer", 35, [15, 17, 19]],
        ["Epic Biome Randomizer", 100, [25, 28, 30]],
        ["Legendary Biome Randomizer", 300, [38, 40, 43]],
        ["Mythic Biome Randomizer", 1000, [50, 53, 55]],
        ["Divine Biome Randomizer", 3000, [60, 63, 66]],
        ["Reality Randomizer", 10000, [69, 71, 73]]
      ].map((x) => ({ name: x[0], luck: x[1], recipe: x[2] }));

      let inventory = {
        potions: Array(10).fill(0),
        gloves: Array(10).fill(0),
        randomizers: Array(7).fill(0)
      };

      let autoCraft = {
        potion: null,
        glove: null,
        randomizer: null
      };

      let rolls = 0;
      let equippedAura = null;
      let equippedGlove = null;
      let potionLuck = 0;
      let auto = false;
      let busy = false;
      let rarest = -1;
      let admin = false;
      let currentBiome = biomes[0];
      let biomeTime = currentBiome.time;
      let biomeVisits = {};
      let milestones = {};

      /* SAVE / LOAD */
      function save() {
        if (admin) return;
        localStorage.setItem("auraRoll", JSON.stringify({
          auras, inventory, autoCraft, rolls, equippedAura,
          equippedGlove, potionLuck, biomeVisits,
          currentBiome: currentBiome.name, biomeTime, rarest, milestones
        }));
      }

      function load() {
        let s = localStorage.getItem("auraRoll");
        if (!s) return;
        try {
          let d = JSON.parse(s);
          if (d.auras) {
            d.auras.forEach((a, i) => { if (auras[i]) Object.assign(auras[i], a); });
          }
          inventory = d.inventory || inventory;
          autoCraft = d.autoCraft || autoCraft;
          rolls = d.rolls || 0;
          equippedAura = d.equippedAura ?? null;
          equippedGlove = d.equippedGlove ?? null;
          potionLuck = d.potionLuck || 0;
          biomeVisits = d.biomeVisits || {};
          rarest = d.rarest ?? -1;
          milestones = d.milestones || {};
          currentBiome = biomes.find((b) => b.name === d.currentBiome) || biomes[0];
          biomeTime = d.biomeTime || currentBiome.time;
        } catch (e) {}
      }

      /* ADMIN */
      function adminToggle() {
        let input = document.getElementById("adminInput");
        if (input.value.toLowerCase() === "rocky") {
          admin = !admin;
          if (admin) {
            auras.forEach((a) => { a.owned = 999999; a.total = 999999; });
            inventory.potions.fill(999);
            inventory.gloves.fill(999);
            inventory.randomizers.fill(999);
            equippedAura = 0;
            equippedGlove = 9;
            toast("ADMIN MODE ON — NOTHING SAVES");
          } else {
            load();
            toast("ADMIN MODE OFF — SAVING RESTORED");
          }
          update();
        }
      }

      /* LUCK & ROLLS */
      function totalLuck() {
        let glove = equippedGlove === null ? 0 : gloves[equippedGlove].luck;
        let aura = equippedAura === null ? 0 : (equippedAura + 1) * 0.02;
        return (1 + glove + aura + potionLuck) * currentBiome.luck;
      }

      function chooseAura() {
        let weights = auras.map((a, i) => {
          if (i === 79) return 1e-30;
          return Math.pow(1 / a.odds, 0.92) * Math.pow(totalLuck(), 0.7);
        });
        let total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (let i = 0; i < weights.length; i++) {
          r -= weights[i];
          if (r <= 0) return i;
        }
        return 0;
      }

      function normalRoll() {
        if (busy) return;
        busy = true;
        setTimeout(() => {
          doRoll();
          busy = false;
        }, 1000);
      }

      function fastRoll() {
        if (rolls < 150) {
          toast("Fast Roll unlocks at 150 rolls");
          return;
        }
        if (busy) return;
        busy = true;
        setTimeout(() => {
          doRoll();
          busy = false;
        }, 200);
      }

      function doRoll() {
        rolls++;
        let id = chooseAura();
        auras[id].owned++;
        auras[id].total++;
        if (id > rarest) rarest = id;
        potionLuck = 0;

        showResult("✨ " + auras[id].name + " ✨", auras[id].odds ? "1/" + auras[id].odds.toLocaleString() : "1/0");
        vfx(id);
        checkMilestones();
        autoCraftCheck();
        update();
        save();
      }

      function toggleAuto() {
        if (rolls < 50) {
          toast("Auto Roll unlocks at 50 rolls");
          return;
        }
        auto = !auto;
        update();
        if (auto) autoLoop();
      }

      function autoLoop() {
        if (!auto) return;
        setTimeout(() => {
          if (auto) {
            doRoll();
            autoLoop();
          }
        }, rolls >= 150 ? 200 : 1000);
      }

      /* CRAFTING & ACTIONS */
      function hasRecipe(recipe) {
        return recipe.every((i) => auras[i] && auras[i].owned > 0);
      }

      function consume(recipe) {
        recipe.forEach((i) => { auras[i].owned--; });
      }

      function craft(type, i) {
        let item = type === "potion" ? potions[i] : type === "glove" ? gloves[i] : randomizers[i];
        if (!hasRecipe(item.recipe)) {
          toast("Missing required auras");
          return;
        }
        consume(item.recipe);
        let key = type === "potion" ? "potions" : type === "glove" ? "gloves" : "randomizers";
        inventory[key][i]++;
        toast("Crafted " + item.name);
        update();
        save();
      }

      function usePotion(i) {
        if (inventory.potions[i] <= 0) return;
        inventory.potions[i]--;
        potionLuck = potions[i].luck / 100;
        toast(potions[i].name + " activated");
        update();
        save();
      }

      function equipGlove(i) {
        if (inventory.gloves[i] <= 0) {
          toast("You don't own this glove");
          return;
        }
        equippedGlove = i;
        toast("Equipped " + gloves[i].name);
        update();
        save();
      }

      function equipAura(i) {
        if (auras[i].owned <= 0) {
          toast("You don't own this aura");
          return;
        }
        equippedAura = i;
        vfx(i);
        toast("Equipped " + auras[i].name);
        update();
        save();
      }

      function autoCraftSet(type, i) {
        autoCraft[type] = autoCraft[type] === i ? null : i;
        update();
        save();
      }

      function autoCraftCheck() {
        let sets = [
          ["potion", potions, "potions"],
          ["glove", gloves, "gloves"],
          ["randomizer", randomizers, "randomizers"]
        ];
        sets.forEach(([type, list, key]) => {
          let i = autoCraft[type];
          if (i !== null && i !== undefined && hasRecipe(list[i].recipe)) {
            consume(list[i].recipe);
            inventory[key][i]++;
          }
        });
      }

      /* BIOMES */
      function spawnBiome(b) {
        currentBiome = b;
        biomeTime = b.time;
        biomeVisits[b.name] = (biomeVisits[b.name] || 0) + 1;
        document.body.style.background = b.bg;
        toast("🌎 " + b.name + " — x" + b.luck + " LUCK");
        update();
        save();
      }

      function useRandomizer(i) {
        if (inventory.randomizers[i] <= 0) return;
        inventory.randomizers[i]--;
        let b = biomes[1 + Math.floor(Math.random() * (biomes.length - 1))];
        spawnBiome(b);
        update();
        save();
      }

      function checkMilestones() {
        if (rolls >= 10000 && !milestones[10000]) {
          milestones[10000] = 1;
          inventory.potions[0]++;
          toast("🏆 10K ROLLS — FREE POTION");
        }
      }

      /* UI FUNCTIONS */
      function toggleMenu() {
        document.getElementById("panel").classList.toggle("open");
      }

      function showTab(id, button) {
        document.querySelectorAll(".section").forEach((x) => x.classList.remove("active"));
        document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        button.classList.add("active");
      }

      function toast(msg) {
        let t = document.getElementById("toast");
        t.innerText = msg;
        t.style.opacity = "1";
        setTimeout(() => { t.style.opacity = "0"; }, 2000);
      }

      function showResult(title, rarity) {
        let r = document.getElementById("result");
        r.innerHTML = title + "<br><span class='small'>" + rarity + "</span>";
        r.classList.add("show");
        setTimeout(() => { r.classList.remove("show"); }, 1500);
      }

      function recipeText(recipe) {
        return recipe
          .map((i) => {
            let a = auras[i];
            if (!a) return "?";
            let rarity = a.odds ? "1/" + a.odds.toLocaleString() : "1/0";
            return a.name + " (" + rarity + ") — " + a.owned + " owned";
          })
          .join("<br> + ");
      }

      function renderAuras() {
        let html = "<h3>AURAS — " + auras.length + "</h3>";
        auras.forEach((a, i) => {
          html += `
            <div class="card ${a.total ? "" : "locked"}">
              <b>#${i + 1} ${a.total ? a.name : "???"}</b>
              <div class="small">Rarity: ${a.odds ? "1/" + a.odds.toLocaleString() : "1/0"}</div>
              ${
                a.total
                  ? `<div>Owned: ${a.owned}</div>
                     <div>Ever Rolled: ${a.total}</div>
                     <button class="action" onclick="equipAura(${i})">
                       ${equippedAura === i ? "EQUIPPED" : "EQUIP"}
                     </button>`
                  : ""
              }
            </div>`;
        });
        document.getElementById("auras").innerHTML = html;
      }

      function renderPotions() {
        let html = "<h3>POTIONS</h3>";
        potions.forEach((p, i) => {
          html += `
            <div class="card">
              <b>${p.name}</b> (+${p.luck}% Luck)
              <div>Owned: ${inventory.potions[i]}</div>
              <div class="small">${recipeText(p.recipe)}</div>
              <button class="action craft" onclick="craft('potion', ${i})">Craft</button>
              <button class="action" onclick="usePotion(${i})">Use</button>
              <button class="action" onclick="autoCraftSet('potion', ${i})">
                ${autoCraft.potion === i ? "Auto-Craft: ON" : "Auto-Craft: OFF"}
              </button>
            </div>`;
        });
        document.getElementById("potions").innerHTML = html;
      }

      function renderGloves() {
        let html = "<h3>GLOVES</h3>";
        gloves.forEach((g, i) => {
          html += `
            <div class="card">
              <b>${g.name}</b> (+${g.luck}x Luck)
              <div>Owned: ${inventory.gloves[i]}</div>
              <div class="small">${recipeText(g.recipe)}</div>
              <button class="action craft" onclick="craft('glove', ${i})">Craft</button>
              <button class="action" onclick="equipGlove(${i})">
                ${equippedGlove === i ? "EQUIPPED" : "Equip"}
              </button>
              <button class="action" onclick="autoCraftSet('glove', ${i})">
                ${autoCraft.glove === i ? "Auto-Craft: ON" : "Auto-Craft: OFF"}
              </button>
            </div>`;
        });
        document.getElementById("gloves").innerHTML = html;
      }

      function renderBiomes() {
        let html = "<h3>BIOMES & RANDOMIZERS</h3>";
        randomizers.forEach((r, i) => {
          html += `
            <div class="card">
              <b>${r.name}</b>
              <div>Owned: ${inventory.randomizers[i]}</div>
              <div class="small">${recipeText(r.recipe)}</div>
              <button class="action craft" onclick="craft('randomizer', ${i})">Craft</button>
              <button class="action" onclick="useRandomizer(${i})">Use</button>
            </div>`;
        });

        html += "<h4>Discovered Biomes</h4>";
        biomes.forEach((b) => {
          html += `
            <div class="card">
              <b>${b.name}</b> (x${b.luck} Luck)
              <div>Visits: ${biomeVisits[b.name] || 0}</div>
            </div>`;
        });
        document.getElementById("biomes").innerHTML = html;
      }

      function renderLeaderboard() {
        let html = "<h3>LEADERBOARD</h3><div class='card'>Rarest Aura: " + 
          (rarest >= 0 ? auras[rarest].name : "None") + "</div>";
        document.getElementById("leaderboard").innerHTML = html;
      }

      function update() {
        document.getElementById("rolls").innerText = rolls.toLocaleString();
        document.getElementById("rarest").innerText = rarest >= 0 ? auras[rarest].name : "None";
        document.getElementById("biome").innerText = currentBiome.name;
        document.getElementById("auto").style.background = auto ? "#00aa00" : "#111";

        renderAuras();
        renderPotions();
        renderGloves();
        renderBiomes();
        renderLeaderboard();
      }

      function vfx(id) {
        let container = document.getElementById("vfx");
        container.innerHTML = "";
        for (let i = 0; i < 15; i++) {
          let spark = document.createElement("div");
          spark.className = "spark";
          spark.style.left = "50%";
          spark.style.top = "50%";
          spark.style.setProperty("--x", (Math.random() * 200 - 100) + "px");
          spark.style.setProperty("--y", (Math.random() * 200 - 100) + "px");
          container.appendChild(spark);
        }
      }

      // Biome timer loop
      setInterval(() => {
        biomeTime--;
        document.getElementById("timer").innerText = biomeTime + "s remaining";
        if (biomeTime <= 0) {
          let b = biomes[Math.floor(Math.random() * biomes.length)];
          spawnBiome(b);
        }
      }, 1000);

      // Startup
      load();
      document.body.style.background = currentBiome.bg;
      update();
    </script>
  </body>
</html>
