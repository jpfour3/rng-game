<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Roll</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#111;
 overflow:hidden;
 transition:.5s;
}

#game{
 width:100vw;
 height:100vh;
 position:relative;
 overflow:hidden;
}

/* =========================
   BACKGROUND FX
========================= */

#fx{
 position:absolute;
 inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:1;
}

.particle{
 position:absolute;
 pointer-events:none;
 animation:float 2s linear infinite;
}

@keyframes float{
 0%{transform:translateY(20px) scale(.3);opacity:0}
 30%{opacity:1}
 100%{transform:translateY(-180px) scale(1.2);opacity:0}
}

.spin{
 animation:spin 4s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

/* =========================
   STAGE
========================= */

#stage{
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 z-index:3;
}

#stick{
 width:120px;
 height:230px;
 position:relative;
}

.head{
 position:absolute;
 left:32px;
 top:0;
 width:56px;
 height:56px;
 border:6px solid #111;
 border-radius:50%;
 z-index:10;
 background:white;
}

.body{
 position:absolute;
 left:57px;
 top:52px;
 width:6px;
 height:95px;
 background:#111;
 z-index:10;
}

.arm,.leg{
 position:absolute;
 left:60px;
 width:70px;
 height:6px;
 background:#111;
 transform-origin:left;
 z-index:10;
}

.a1{top:72px;transform:rotate(145deg)}
.a2{top:72px;transform:rotate(35deg)}
.l1{top:143px;transform:rotate(115deg)}
.l2{top:143px;transform:rotate(65deg)}

/* =========================
   AURA VFX
========================= */

#auraFX{
 position:absolute;
 left:-190px;
 top:-170px;
 width:500px;
 height:500px;
 pointer-events:none;
 z-index:2;
}

/* basic aura */
.aura-ring{
 position:absolute;
 inset:80px;
 border:3px solid currentColor;
 border-radius:50%;
 animation:orbit 3s linear infinite;
}

.aura-ring.r2{
 inset:45px;
 border-style:dashed;
 animation-duration:5s;
}

.aura-ring.r3{
 inset:115px;
 animation-duration:2s;
}

@keyframes orbit{
 to{transform:rotate(360deg)}
}

/* =========================
   SPECIAL SHAPES
========================= */

.shard{
 position:absolute;
 width:18px;
 height:65px;
 background:currentColor;
 clip-path:polygon(50% 0,100% 75%,50% 100%,0 75%);
 animation:shardSpin 3s linear infinite;
}

@keyframes shardSpin{
 0%{transform:rotate(0deg) translateY(-170px)}
 100%{transform:rotate(360deg) translateY(-170px)}
}

.star{
 position:absolute;
 width:55px;
 height:55px;
 background:currentColor;
 clip-path:polygon(
 50% 0,61% 37%,100% 50%,61% 63%,
 50% 100%,39% 63%,0 50%,39% 37%
 );
 animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
 from{transform:scale(.7) rotate(0)}
 to{transform:scale(1.3) rotate(180deg)}
}

.orb{
 position:absolute;
 width:25px;
 height:25px;
 border-radius:50%;
 background:currentColor;
 box-shadow:0 0 25px currentColor;
 animation:orb 2s linear infinite;
}

@keyframes orb{
 0%{transform:rotate(0deg) translateX(150px)}
 100%{transform:rotate(360deg) translateX(150px)}
}

========================= */

.v61{color:#ff3333}

/* =========================
   TOP UI
========================= */

#top{
 position:absolute;
 left:18px;
 top:15px;
 z-index:20;
 font-size:14px;
}

#admin{
 position:absolute;
 right:18px;
 top:15px;
 z-index:30;
 display:flex;
 gap:5px;
}

#adminInput{
 width:105px;
 padding:7px;
 border:1px solid #bbb;
 border-radius:7px;
}

#adminBtn{

 border-radius:7px;
 background:#111;
 color:white;
 padding:7px 10px;
}

#adminStatus{
 position:absolute;
 right:18px;
 top:55px;
 z-index:30;
 font-size:12px;
 font-weight:bold;
}

#bottomInfo{
 position:absolute;
 left:18px;
 bottom:95px;
 z-index:20;
 font-size:14px;
}

/* =========================
   MENU
========================= */

#menu{
 position:absolute;
 right:18px;
 top:50%;
 transform:translateY(-50%);
 width:48px;
 height:75px;
 border:0;
 border-radius:12px;
 background:#111;
 color:white;
 font-size:25px;
 z-index:30;
}

#panel{
 position:absolute;
 right:-430px;
 top:0;
 width:430px;
 height:100%;
 background:#f4f4f4;
 padding:18px;
 overflow:auto;
 transition:.3s;
 z-index:50;
 box-shadow:-5px 0 20px #0002;
}

#panel.open{right:0}

.close{
 float:right;
 border:0;
 background:none;
 font-size:28px;
}

.tabs{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin:35px 0 15px;
}

.tab{
 border:0;
 padding:8px;
 border-radius:7px;
}

.tab.active{
 background:#111;
 color:#fff;
}

.section{display:none}
.section.active{display:block}

.card{
 background:#fff;
 border:1px solid #ccc;
 border-radius:9px;
 padding:10px;
 margin:8px 0;
}

button{cursor:pointer}

.action{
 border:0;
 border-radius:6px;
 padding:7px;
 margin-top:5px;
}

.craft{
 background:#111;
 color:#fff;
 width:100%;
}

/* =========================
   DROPDOWN CRAFTING
========================= */

.craftBox{
 margin-top:7px;
}

.craftBox summary{
 cursor:pointer;
 padding:8px;
 background:#eee;
 border-radius:6px;
 font-weight:bold;
}

.craftInside{
 padding-top:8px;
}

/* =========================
   ROLL BUTTONS
========================= */

#buttons{
 position:absolute;
 bottom:18px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:10px;
 z-index:30;
}

.roll{
 width:125px;
 height:55px;
 background:#111;
 color:#fff;
 border:0;
 border-radius:12px;
 font-weight:bold;
}

.roll:disabled{
 opacity:.4;
}

#result{
 position:absolute;
 top:57%;
 left:50%;
 transform:translate(-50%,-50%);
 text-align:center;
 font-size:30px;
 font-weight:bold;
 opacity:0;
 transition:.2s;
 pointer-events:none;
 z-index:40;
}

#result.show{
 opacity:1;
}

#result .rarity{
 font-size:15px;
 margin-top:8px;
}

.small{
 font-size:12px;
 opacity:.7;
}

#toast{
 position:absolute;
 top:18px;
 left:50%;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:9px 14px;
 border-radius:9px;
 opacity:0;
 z-index:100;
}

.voidMode{
 animation:voidScreen .7s infinite alternate;
}

@keyframes voidScreen{
 from{filter:brightness(.5)}
 to{filter:brightness(1.2)}
}

/* =========================
   ADMIN MODE
========================= */

body.adminMode #stage{
 filter:drop-shadow(0 0 25px #000);
}

body.adminMode #adminStatus{
 color:#ff2222;
}

body.adminMode #top{
 text-decoration:line-through;
}

/* =========================
   AURA-SPECIFIC VFX
========================= */

.vfx-spark .star{animation-duration:.4s}
.vfx-pebble .orb{animation-duration:5s}
.vfx-leaf .star{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.vfx-breeze .aura-ring{border-style:dotted}
.vfx-drop .orb{border-radius:50% 50% 60% 60%}
.vfx-dust .particle{width:4px;height:4px}

.vfx-ember .particle{box-shadow:0 0 15px currentColor}
.vfx-frost .shard{width:12px;height:80px}
.vfx-thunder .aura-ring{border-width:6px}
.vfx-flame .star{clip-path:polygon(50% 0,75% 35%,100% 45%,65% 60%,50% 100%,35% 60%,0 45%,25% 35%)}

========================= */

 position:absolute;

{name:"Golden Glove",luck:10,recipe:[10,12,15]},
{name:"Crystal Glove",luck:20,recipe:[17,19,21]},
{name:"Shadow Glove",luck:40,recipe:[25,27,29]},
{name:"Void Glove",luck:80,recipe:[32,34,36]},
{name:"Galaxy Glove",luck:160,recipe:[40,42,44]},
{name:"Divine Glove",luck:350,recipe:[50,52,54]},
{name:"Reality Glove",luck:800,recipe:[60,62,64]},
{name:"Infinite Glove",luck:2000,recipe:[68,70,73]}
];

/* =========================================================
   RANDOMIZERS
========================================================= */

const randomizers=[
{name:"Basic Biome Randomizer",luck:1.2,recipe:[8,9,10]},
{name:"Rare Biome Randomizer",luck:1.5,recipe:[15,17,19]},
{name:"Epic Biome Randomizer",luck:2,recipe:[25,28,30]},
{name:"Legendary Biome Randomizer",luck:3,recipe:[38,40,43]},
{name:"Mythic Biome Randomizer",luck:5,recipe:[50,53,55]},
{name:"Divine Biome Randomizer",luck:8,recipe:[60,63,66]},
{name:"Reality Randomizer",luck:15,recipe:[69,71,73]}
];

let inventory={
 potions:Array(10).fill(0),
 gloves:Array(10).fill(0),
 randomizers:Array(7).fill(0)
};

let autoCraft={
 potion:null,
 glove:null,
 randomizer:null
};

let rolls=0;
let equippedAura=null;
let equippedGlove=null;
let potionLuck=0;
let auto=false;
let busy=false;
let rarest=-1;
let milestones={};
let admin=false;

/* =========================================================
   SAVE
========================================================= */

function save(){

 if(admin)return;

 localStorage.setItem("auraRoll",JSON.stringify({
  auras,
  inventory,
  autoCraft,
  rolls,
  equippedAura,
  equippedGlove,
  potionLuck,
  biomeVisits,
  currentBiome:currentBiome.name,
  biomeTime,
  rarest,
  milestones
 }));

}

/* =========================================================
   LOAD
========================================================= */

function load(){

 let s=localStorage.getItem("auraRoll");

 if(!s)return;

 try{

  let d=JSON.parse(s);

  if(d.auras)
   d.auras.forEach((a,i)=>Object.assign(auras[i],a));

  if(d.inventory)
   inventory=d.inventory;

  if(d.autoCraft)
   autoCraft=d.autoCraft;

  rolls=d.rolls||0;
  equippedAura=d.equippedAura;
  equippedGlove=d.equippedGlove;
  potionLuck=d.potionLuck||0;
  biomeVisits=d.biomeVisits||{};
  biomeTime=d.biomeTime||120;
  rarest=d.rarest??-1;
  milestones=d.milestones||{};

  let b=biomes.find(x=>x.name===d.currentBiome);

  if(b)currentBiome=b;

 }catch(e){}

}

/* =========================================================
   ADMIN
========================================================= */

function toggleAdmin(){

 let input=document.getElementById("adminInput").value.trim().toLowerCase();

 if(input!=="rocky"){
  toast("Wrong admin code");
  return;
 }

 admin=!admin;

 document.body.classList.toggle("adminMode",admin);

 document.getElementById("adminStatus").textContent=
 admin?"ADMIN MODE ACTIVE":"";

 if(admin){
  giveEverything();
  toast("ADMIN MODE ON — ROLLS VOIDED");
 }else{
  toast("ADMIN MODE OFF");
 }

 update();

}

/* ADMIN DOES NOT SAVE ANYTHING */

function giveEverything(){

 auras.forEach(a=>{
  a.owned=999999;
  a.total=999999;
 });

 inventory.potions.fill(999999);
 inventory.gloves.fill(999999);
 inventory.randomizers.fill(999999);

 equippedAura=79;
 equippedGlove=9;

 applyAura();

}

/* =========================================================
   LUCK
========================================================= */

function totalLuck(){

 let glove=
 equippedGlove===null
 ?0
 :gloves[equippedGlove].luck;

 let aura=
 equippedAura===null
 ?0
 :(equippedAura+1)*.02;

 return (1+glove+aura+potionLuck)*currentBiome.luck;

}

/* =========================================================
   ROLL
========================================================= */

function chooseAura(){

 let luck=totalLuck();

 let weights=auras.map((a,i)=>{

  if(i===79)
   return 0.000000000000000000000000001;

  return (1/a.odds)*Math.pow(luck,.55);

 });

 let total=weights.reduce((a,b)=>a+b,0);

 let r=Math.random()*total;

 for(let i=0;i<weights.length;i++){

  r-=weights[i];

  if(r<=0)return i;

 }

 return 0;

}

function normalRoll(){

 if(busy)return;

 busy=true;

 setTimeout(()=>{

  doRoll();

  busy=false;

 },1000);

}

function fastRoll(){

 if(rolls<150 && !admin){

  toast("Fast Roll unlocks at 150 rolls");

  return;

 }

 if(busy)return;

 busy=true;

 setTimeout(()=>{

  doRoll();

  busy=false;

 },200);

}

function doRoll(){

 let id=chooseAura();

 /* ADMIN ROLLS ARE COMPLETELY VOID */

 if(admin){

  showResult(
   "ADMIN ROLL VOID",
   "Nothing saved"
  );

  return;
 }

 rolls++;

 auras[id].owned++;
 auras[id].total++;

 if(id>rarest)
  rarest=id;

 potionLuck=0;

 let rarity=
  auras[id].odds===0
  ?"1/0"
  :"1/"+auras[id].odds.toLocaleString();

 showAuraVFX(id);

 showResult(
  "✨ "+auras[id].name+" ✨",
  rarity
 );

 checkMilestones();
 autoCraftCheck();

 update();
 save();

}

/* =========================================================
   AUTO ROLL
========================================================= */

function toggleAuto(){

 if(rolls<50 && !admin){

  toast("Auto Roll unlocks at 50 rolls");

  return;

 }

 auto=!auto;

 update();

 if(auto)
  autoLoop();

}

function autoLoop(){

 if(!auto)return;

 let delay=
  rolls>=150
  ?200
  :1000;

 setTimeout(()=>{

  if(!auto)return;

  doRoll();
  autoLoop();

 },delay);

}

/* =========================================================
   CRAFTING
========================================================= */

function hasRecipe(recipe){

 return recipe.every(i=>auras[i].owned>0);

}

function consume(recipe){

 recipe.forEach(i=>{
  auras[i].owned--;
 });

}

function craftPotion(i){

 let p=potions[i];

 if(!hasRecipe(p.recipe)){

  toast("Missing required auras");
  return;

 }

 consume(p.recipe);

 inventory.potions[i]++;

 toast("Crafted "+p.name);

 update();
 save();

}

function craftGlove(i){

 let g=gloves[i];

 if(!hasRecipe(g.recipe)){

  toast("Missing required auras");
  return;

 }

 consume(g.recipe);

 inventory.gloves[i]++;

 toast("Crafted "+g.name);

 update();
 save();

}

function craftRandomizer(i){

 let r=randomizers[i];

 if(!hasRecipe(r.recipe)){

  toast("Missing required auras");
  return;

 }

 consume(r.recipe);

 inventory.randomizers[i]++;

 toast("Crafted "+r.name);

 update();
 save();

}

function usePotion(i){

 if(inventory.potions[i]<=0)return;

 inventory.potions[i]--;

 potionLuck=potions[i].luck/100;

 toast(potions[i].name+" activated");

 update();
 save();

}

function equipGlove(i){

 if(inventory.gloves[i]<=0){

  toast("You don't own this glove");
  return;

 }

 equippedGlove=i;

 toast("Equipped "+gloves[i].name);

 update();
 save();

}

function equipAura(i){

 if(auras[i].owned<=0){

  toast("You don't own this aura");
  return;

 }

 equippedAura=i;

 applyAura();

 toast("Equipped "+auras[i].name);

 update();
 save();

}

function autoCraftSet(type,i){

 autoCraft[type]=
  autoCraft[type]===i
  ?null
  :i;

 update();
 save();

}

function autoCraftCheck(){

 if(autoCraft.potion!==null){

  let i=autoCraft.potion;

  if(hasRecipe(potions[i].recipe)){

   consume(potions[i].recipe);
   inventory.potions[i]++;

  }

 }

 if(autoCraft.glove!==null){

  let i=autoCraft.glove;

  if(hasRecipe(gloves[i].recipe)){

   consume(gloves[i].recipe);
   inventory.gloves[i]++;

  }

 }

 if(autoCraft.randomizer!==null){

  let i=autoCraft.randomizer;

  if(hasRecipe(randomizers[i].recipe)){

   consume(randomizers[i].recipe);
   inventory.randomizers[i]++;

  }

 }

}

/* =========================================================
   BIOMES
========================================================= */

function naturalBiome(){

 let weights=biomes.map((b,i)=>{

  if(i===0)return 30;

  return 1/(b.rare/100+1);

 });

 let total=weights.reduce((a,b)=>a+b,0);

 let r=Math.random()*total;

 for(let i=0;i<weights.length;i++){

  r-=weights[i];

  if(r<=0)return biomes[i];

 }

 return biomes[0];

}

function spawnBiome(b){

 currentBiome=b;
 biomeTime=b.time;

 biomeVisits[b.name]=(biomeVisits[b.name]||0)+1;

 document.body.style.background=b.bg;

 toast("🌎 "+b.name+" biome!");

 update();
 save();

}

function useRandomizer(i){

 if(inventory.randomizers[i]<=0)return;

 inventory.randomizers[i]--;

 let possible=biomes.slice(1);

 let b=
  possible[
   Math.floor(Math.random()*possible.length)
  ];

 spawnBiome(b);

 update();
 save();

}

/* =========================================================
   MILESTONES
========================================================= */

function checkMilestones(){

 if(rolls>=10000&&!milestones[10000]){

  milestones[10000]=true;

  inventory.potions[0]++;

  toast("🏆 10K ROLLS — FREE POTION!");

 }

 let amount=Math.floor(rolls/50000);

 for(let i=1;i<=amount;i++){

  let mark=i*50000;

  if(!milestones[mark]){

   milestones[mark]=true;
   inventory.potions[0]++;

   toast(
    "🏆 "+
    mark.toLocaleString()+
    " ROLLS — FREE POTION!"
   );

  }

 }

}

/* =========================================================
   UI
========================================================= */

function toggleMenu(){

 document
  .getElementById("panel")
  .classList.toggle("open");

}

function showTab(id,btn){

 document
  .querySelectorAll(".section")
  .forEach(x=>x.classList.remove("active"));

 document
  .querySelectorAll(".tab")
  .forEach(x=>x.classList.remove("active"));

 document
  .getElementById(id)
  .classList.add("active");

 btn.classList.add("active");

}

function rarityText(a){

 return a.odds===0
  ?"1/0"
  :"1/"+a.odds.toLocaleString();

}

function recipeText(recipe){

 return recipe.map(i=>{

  let a=auras[i];

  return `
   <div>
   ${a.name}
   — ${rarityText(a)}
   — ${a.owned||0}/1
   </div>
  `;

 }).join("");

}

/* =========================================================
   AURA INDEX
========================================================= */

/* =========================================================
   BIOMES
========================================================= */

function renderBiomes(){

 let html="<h3>BIOMES</h3>";

 html+=`

 <div class="card">

  <b>Current: ${currentBiome.name}</b>

  <div>
  Luck: x${currentBiome.luck}
  </div>

  <div>
  ${biomeTime}s remaining
  </div>

 </div>

 `;

 randomizers.forEach((r,i)=>{

  html+=`

  <div class="card">

   <b>${r.name}</b>

   <div>
   Owned: ${inventory.randomizers[i]}
   </div>

   <div>
   Luck Effect: x${r.luck}
   </div>

   <details class="craftBox">

    <summary>

    </summary>

     ${recipeText(r.recipe)}

  `;

 });

 html+="<h3>BIOME INDEX</h3>";

 biomes.forEach(b=>{

  html+=`

  <div class="card">

   <b>${count?b.name:"???"}</b>

   <div>
   Times Visited: ${count}
   </div>

   ${
    count
    ?
    `
    <div>Duration: ${b.time}s</div>
    <div>Rarity: 1/${b.rare}</div>
    <div>Luck: x${b.luck}</div>
    `
    :
    `<div class="small">Undiscovered</div>`
   }

  </div>

  `;

 });

 document.getElementById("biomes").innerHTML=html;

}

/* =========================================================
   LEADERBOARD
========================================================= */

function renderLeaderboard(){

 document.getElementById("leaderboard").innerHTML=`

 <h3>LEADERBOARD</h3>

 <div class="card">
 <b>#1 You</b>
 <div>${rolls.toLocaleString()} rolls</div>
 </div>

 <div class="card">
 <b>Rarest Rolled</b>
 <div>
 ${
  rarest>=0
  ?auras[rarest].name
  :"None"
 }
 </div>
 </div>

 <div class="card">
 <b>Total Luck</b>
 <div>
 x${totalLuck().toFixed(2)}
 </div>
 </div>

 `;

}

/* =========================================================
   UPDATE
========================================================= */

function update(){

 document.getElementById("rolls").textContent=
  rolls.toLocaleString();

 document.getElementById("rarest").textContent=
  rarest>=0
  ?auras[rarest].name
  :"None";

 document.getElementById("biome").textContent=
  currentBiome.name;

 document.getElementById("timer").textContent=
  biomeTime+"s remaining";

 document.getElementById("auto").innerHTML=
  (auto?"STOP AUTO":"AUTO ROLL")+
  "<br><small>"+
  (rolls>=50||admin?"Unlocked":"50 rolls")+
  "</small>";

 document.getElementById("fast").innerHTML=
  "FAST ROLL<br><small>"+
  (rolls>=150||admin?"Unlocked":"150 rolls")+
  "</small>";

 renderAuras();
 renderPotions();
 renderGloves();
 renderBiomes();
 renderLeaderboard();

 applyAura();

}

/* =========================================================
   RESULT
========================================================= */

function showResult(name,rarity){

 let r=document.getElementById("result");

 r.innerHTML=
  name+
  "<div class='rarity'>"+
  rarity+
  "</div>";

 r.classList.add("show");

 setTimeout(()=>{
  r.classList.remove("show");
 },1000);

}

/* =========================================================
   TOAST
========================================================= */

function toast(text){

 let t=document.getElementById("toast");

 t.textContent=text;
 t.style.opacity=1;

 clearTimeout(window.tt);

 window.tt=setTimeout(()=>{
  t.style.opacity=0;
 },1800);

}

/* =========================================================
   BIG AURA VFX ENGINE
========================================================= */

function clearVFX(){

 document.getElementById("auraFX").innerHTML="";
 document.getElementById("fx").innerHTML="";

}

function createParticle(x,y,size=6){

 let p=document.createElement("div");

 p.className="particle";

 p.style.left=x+"px";
 p.style.top=y+"px";
 p.style.width=size+"px";
 p.style.height=size+"px";

 document.getElementById("fx").appendChild(p);

 setTimeout(()=>{
  p.remove();
 },2500);

}

function showAuraVFX(id){

 clearVFX();

 let box=document.getElementById("auraFX");

 let cls=
  auraClasses[id]||"spark";

 box.className="vfx-"+cls+" v"+(id+1);

 /* rings */

 for(let i=0;i<3;i++){

  let ring=document.createElement("div");

  ring.className="aura-ring r"+(i+1);

  box.appendChild(ring);

 }

 /* shards */

 for(let i=0;i<8;i++){

  let s=document.createElement("div");

  s.className="shard";

  s.style.left="240px";
  s.style.top="230px";
  s.style.transform=
   "rotate("+(i*45)+"deg)";

  box.appendChild(s);

 }

 /* stars */

 for(let i=0;i<3;i++){

  let star=document.createElement("div");

  star.className="star";

  star.style.left=(150+i*70)+"px";
  star.style.top=(130+i*45)+"px";

  box.appendChild(star);

 }

 /* orbiting orbs */

 for(let i=0;i<5;i++){

  let orb=document.createElement("div");

  orb.className="orb";

  orb.style.left="230px";
  orb.style.top="220px";

  orb.style.animationDelay=
   (i*.2)+"s";

  box.appendChild(orb);

 }

 /* particles */

 for(let i=0;i<35;i++){

  setTimeout(()=>{

   let p=document.createElement("div");

   p.className="particle";

   p.style.left=
    (35+Math.random()*430)+"px";

   p.style.top=
    (250+Math.random()*250)+"px";

   p.style.width=
    (3+Math.random()*10)+"px";

   p.style.height=
    (3+Math.random()*10)+"px";

   p.style.borderRadius="50%";

   box.appendChild(p);

  },i*20);

 }

 /* rare aura screen flash */

 if(id>=60){

  let flash=document.createElement("div");

  flash.className="rarityFlash";

  document.getElementById("game")
   .appendChild(flash);

  setTimeout(()=>{
   flash.remove();
  },700);

 }

}

/* =========================================================
   EQUIPPED AURA
========================================================= */

function applyAura(){

 clearVFX();

 if(equippedAura===null)
  return;

 let box=document.getElementById("auraFX");

 let id=equippedAura;

 box.className=
  "vfx-"+auraClasses[id]+
  " v"+(id+1);

 for(let i=0;i<3;i++){

  let ring=document.createElement("div");

  ring.className=
   "aura-ring r"+(i+1);

  box.appendChild(ring);

 }

 for(let i=0;i<8;i++){

  let s=document.createElement("div");

  s.className="shard";

  s.style.left="240px";
  s.style.top="230px";
  s.style.transform=
   "rotate("+(i*45)+"deg)";

  box.appendChild(s);

 }

 for(let i=0;i<3;i++){

  let star=document.createElement("div");

  star.className="star";

  star.style.left=(150+i*70)+"px";
  star.style.top=(130+i*45)+"px";

  box.appendChild(star);

 }

}

/* =========================================================
   BIOME TIMER
========================================================= */

setInterval(()=>{

 biomeTime--;

 if(biomeTime<=0){

  spawnBiome(naturalBiome());

 }

 update();

 if(!admin)
  save();

},1000);

/* =========================================================
   START
========================================================= */

load();

document.body.style.background=
 currentBiome.bg;

update();

</script>
